; =============================================================================
; PHP-FPM Pool Configuration for AutoERP
; =============================================================================

[www]
; User/group
user = www
group = www

; Listen on socket for nginx
listen = /var/run/php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660

; Process management - dynamic for variable load
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500

; Slow log for debugging performance issues
slowlog = /var/log/php/slow.log
request_slowlog_timeout = 10s

; Request timeout
; P0-2 deadline ordering: PHP 240 < FPM 300 < nginx 330; revert with the queued-provisioning ticket.
request_terminate_timeout = 300s

; Status page (for health checks)
pm.status_path = /fpm-status

; Ping page (for health checks)
ping.path = /fpm-ping
ping.response = pong

; Clear environment
clear_env = no

; Catch workers output
catch_workers_output = yes
decorate_workers_output = no

; Access log for debugging (shows SCRIPT_FILENAME)
access.log = /dev/stderr
access.format = "[php-fpm] %t \"%m %r\" status:%s script:%f"

; Security: only allow specific extensions
security.limit_extensions = .php
