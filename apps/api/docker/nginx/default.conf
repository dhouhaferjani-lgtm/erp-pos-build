# =============================================================================
# Nginx Virtual Host Configuration for AutoERP API
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php;

    # Docker internal DNS resolver (needed for variable-based proxy_pass)
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for load balancers (before php handling)
    location = /api/health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Alternative health check path (nginx-only, no PHP)
    location = /health {
        default_type text/plain;
        return 200 'healthy';
    }

    # Root path - redirect to API docs or return basic info
    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"autoerp-api"}';
    }

    # FPM status (for monitoring)
    location = /fpm-status {
        access_log off;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    location = /fpm-ping {
        access_log off;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock;
    }

    # WebSocket proxy to Reverb
    # Default: 127.0.0.1:8080 (bundled mode, Reverb runs in same container)
    # In split-container mode, set REVERB_SERVER_HOST env var and the
    # entrypoint will substitute it here (e.g., "websocket" service hostname)
    # NOTE: Using a variable for proxy_pass so nginx resolves the upstream
    # at request time, not at startup (prevents crash if host is unreachable).
    location /app/ {
        set $reverb_upstream "http://127.0.0.1:8080";
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        # Check file exists before passing to PHP-FPM
        try_files $uri =404;

        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;

        # Use $uri instead of $fastcgi_script_name for reliability
        # Script information - MUST come first
        fastcgi_param SCRIPT_FILENAME   $document_root$uri;
        fastcgi_param SCRIPT_NAME       $uri;
        fastcgi_param DOCUMENT_ROOT     $document_root;

        # Request information - CRITICAL: use $request_uri for Laravel routing
        fastcgi_param REQUEST_METHOD    $request_method;
        fastcgi_param REQUEST_URI       $request_uri;
        fastcgi_param QUERY_STRING      $query_string;
        fastcgi_param CONTENT_TYPE      $content_type;
        fastcgi_param CONTENT_LENGTH    $content_length;

        # Server information
        fastcgi_param SERVER_PROTOCOL   $server_protocol;
        fastcgi_param SERVER_SOFTWARE   nginx/$nginx_version;
        fastcgi_param SERVER_NAME       $server_name;
        fastcgi_param SERVER_ADDR       $server_addr;
        fastcgi_param SERVER_PORT       $server_port;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;

        # Client information
        fastcgi_param REMOTE_ADDR       $remote_addr;
        fastcgi_param REMOTE_PORT       $remote_port;

        # HTTPS detection (for when behind reverse proxy)
        fastcgi_param HTTPS             $https if_not_empty;
        fastcgi_param HTTP_PROXY        "";

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        # P0-2 deadline ordering: PHP 240 < FPM 300 < nginx 330; revert with the queued-provisioning ticket.
        fastcgi_read_timeout 330s;

        # Buffer sizes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|svn) {
        deny all;
    }

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Favicon handling
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
