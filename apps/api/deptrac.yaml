# Deptrac Configuration — AutoERP hexagonal-architecture boundary enforcement
#
# Run directly:   ./vendor/bin/deptrac analyse --config-file=deptrac.yaml
# Run ratcheted:  php tools/deptrac-ratchet.php --config=deptrac.yaml --baseline=deptrac.baseline.json
#
# Strategy (M3.1, dev deferred backlog 2026-05-14):
#   Rather than enumerate ~39 modules x 4 layers by hand (the previous config
#   covered only 12 modules and referenced a phantom "Sales" module), the
#   layers are GLOB-based: one layer per hexagonal tier, collecting every
#   module's matching sub-directory. This covers every current AND future
#   module automatically and never goes stale.
#
#   What this enforces: the hexagonal dependency direction WITHIN the module
#   tree — Domain may not reach up into Application / Infrastructure /
#   Presentation; Application may not reach into Infrastructure / Presentation;
#   Infrastructure may not reach into Presentation.
#
#   What this deliberately does NOT enforce: cross-module coupling (module A's
#   Domain depending on module B's Domain is a same-layer dependency and is
#   allowed). Per the M3 plan, cross-module Application coupling is a separate
#   follow-up ticket — it needs per-module layers, which is a much larger
#   effort than the first-tenant baseline this task targets.

deptrac:
  paths:
    - ./app

  exclude_files:
    - '#.*[Tt]est.*#'

  layers:
    # --- Shared kernel (consumable by the matching module tiers) ----------
    - name: SharedDomain
      collectors:
        - type: directory
          value: app/Shared/Domain/.*

    - name: SharedContracts
      collectors:
        - type: directory
          value: app/Shared/Contracts/.*

    - name: SharedApplication
      collectors:
        - type: directory
          value: app/Shared/Application/.*

    - name: SharedInfrastructure
      collectors:
        - type: directory
          value: app/Shared/Infrastructure/.*

    # --- Module hexagonal tiers (one glob layer per tier, all modules) ----
    - name: ModuleDomain
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Domain/.*

    - name: ModuleApplication
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Application/.*

    - name: ModuleInfrastructure
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Infrastructure/.*

    - name: ModulePresentation
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Presentation/.*

  ruleset:
    # --- Shared kernel internal direction --------------------------------
    # SharedDomain is pure (no allowed dependencies — omitted from the
    # ruleset entirely). The shared kernel must NOT depend on any module
    # tier — those dependencies stay flagged as violations.
    SharedContracts:
      - SharedDomain
    SharedApplication:
      - SharedDomain
      - SharedContracts
    SharedInfrastructure:
      - SharedDomain
      - SharedContracts
      - SharedApplication

    # Domain is the core: it may only depend on the shared domain kernel and
    # shared contracts. Any dependency on Application / Infrastructure /
    # Presentation is a hexagonal violation (hard-fail in the ratchet).
    ModuleDomain:
      - SharedDomain
      - SharedContracts

    # Application orchestrates Domain; it may use the shared application kernel.
    ModuleApplication:
      - ModuleDomain
      - SharedDomain
      - SharedContracts
      - SharedApplication

    # Infrastructure implements Domain/Application ports; it may use the
    # shared infrastructure kernel.
    ModuleInfrastructure:
      - ModuleDomain
      - ModuleApplication
      - SharedDomain
      - SharedContracts
      - SharedApplication
      - SharedInfrastructure

    # Presentation (controllers, requests, resources) sits at the edge and
    # may depend on every inner tier.
    ModulePresentation:
      - ModuleDomain
      - ModuleApplication
      - ModuleInfrastructure
      - SharedDomain
      - SharedContracts
      - SharedApplication
      - SharedInfrastructure
