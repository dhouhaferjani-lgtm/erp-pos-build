[package]
name = "izipos"
version = "0.1.0"
description = "IziPOS - Desktop POS for Food & Beverage"
authors = ["Syneriva"]
edition = "2021"

[lib]
name = "izipos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "devtools"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
serialport = "4"
tokio = { version = "1", features = ["net", "time", "rt"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
dirs = "5"
