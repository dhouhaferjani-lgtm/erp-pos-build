    question: "OI-12: the marker backfill logs rows written, DNs stamped without invoiced_via, and the four legacy-survey counts (missing / unparseable / dangling / cross-company invoice_id). No silent try/catch; a dirty row is written invoice_id=NULL + legacy_unknown and COUNTED, never aborting the tenant loop. The actual per-tenant STAGING counts are read from the tenants:migrate log by whoever promotes — the executor cannot promote. Record the survey mechanism + the fact the counts are owner-owed in `findings:`; do NOT reconcile or 'clean' data."
