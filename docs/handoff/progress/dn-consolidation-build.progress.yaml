    question: "OI-9: `legacy_unknown` STANDS until the owner overturns it. Ship the fourth enum case + the neutral badge exactly as spec §4.2 item 2 states; it is a WRITE-ONCE historical value and a test asserts no new write can produce it. Do NOT implement the lossy alternative (all legacy -> consolidation). This is a RECORDED FINDING in `findings:`, not a decision to re-take."
