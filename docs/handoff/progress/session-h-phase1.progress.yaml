owes_parent:
  - M1 browser contract mismatch: public row-level import validation returns 201 with failed_rows and exposes field errors through GET /imports/{id}/errors; no dedicated 422 preview endpoint exists. The focused validator Feature test still proves the 51-character code raises a 422 ValidationException.
  - M2 Arabic label collision: the owner-prescribed Nature label `النوع` is byte-identical to the adjacent role Type label. Nature now has a distinct placeholder and validation error, but changing the prescribed label requires parent/owner copy approval.
  - M2 create-surface gap: create-only Nature validation is scoped to full `PartnerForm`; the inline `AddPartnerModal` remains shape-neutral and can create `customer_category = NULL`. Phase 2 must make nature canonical across every write surface.
  - M2 supplier credit warning: the new warning intentionally uses customer exposure (`receivable - credit`) and therefore does not warn on supplier payable exposure. Phase 2 should either hide/rename the customer credit-limit control on supplier-only routes or define a separate supplier exposure policy.
  - M2 accepted P3 UI edges: a legacy-null B2B section can unmount when its last internal signal is cleared; retained hidden values still submit after switching to Individual; scan-prefilled VAT can reveal B2B fields before Nature is chosen. No data loss; re-evaluate when Phase 2 makes nature canonical.
  - M3 pre-existing vehicle enum drift: VehicleForm still offers display-cased fuel/transmission literals while backend enums use lowercase canonical values; M3 did not broaden this payload behavior.
  - M3 partner-code contract realignment: validation now matches the existing `(company_id, code)` database constraint, changing same-tenant cross-company create from 422 to 201; promotion must communicate the relaxation to API, POS pending-customer, and Parties-import consumers.
  - M3 Otospex browser debt: browser item (v) is locally runtime-skipped because `demo-unlimited` has no provisioned tenant database; the customer-only picker has focused Vitest evidence but no live Otospex browser evidence here.
  - M3 i18n burn-down: removal-only cleanup translated eight prior baseline entries with zero new gaps; no baseline re-pin was required, and parent may lock the burn-down at promotion.
  - M3 Phase 2 form-state debt: mismatched `partnerType` and pathname can make both route contexts true in an unkeyed reconciliation; production keyed routes prevent the live path and validation blocks submission, but Phase 2 should derive one authoritative context independently of React keys.
