    question: "SV-11 §5.1 asks for en+fr+ar keys and OD:76 runs en/fr/ar in parallel, but apps/pos ships only en and fr (apps/pos/src/locales/{en,fr}; lib/i18n.ts registers exactly two languages). Standing up an Arabic locale + RTL for the DEVICE app is a new surface, not cheap translation work, and not SV-11's scope. M2 ships en+fr and files the ticket; the OWNER later decides whether to open a separate device-Arabic lane. INFORMATIONAL ONLY — this never blocks a milestone. (apps/web already has ar and is done in parallel at M3.)"
