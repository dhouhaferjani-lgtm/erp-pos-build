    # Implementation content = deliverable D (item iv), red-first proven:
    # the chokepoint raised its balance refusal as a BARE \InvalidArgumentException
    # while the house type (UnbalancedJournalEntryException) already existed. It now
    # raises the house type; the type was made a subclass of \InvalidArgumentException
