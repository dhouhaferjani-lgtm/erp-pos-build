    #
    # GENUINE class-(c) balance gaps: ZERO. All 6 production bypasses are already
    # guarded — 3 via the constructor-injected DoubleEntryValidator (AccountingService
    # assertLegsBalance), 3 balanced by construction + scale-clamped upstream. Per the
