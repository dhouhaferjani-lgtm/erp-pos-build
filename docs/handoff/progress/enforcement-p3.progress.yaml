#          d2. P2's CLOSE TAG at C: C derived as first-parent child of p2_landed_sha with a
#              conforming diff-tree, base blobs == C's blobs, tag resolves to C, annotation EXACTLY
#              {closing_commit == C, closing_check == pass, accepted_sha == p2_landed_sha} — no
#              manifest/control lines on the close tag.
#   3. COUNTRY-DEFAULTS PRECONDITION for 3(b) (gate-r1 C-3, hardened gate-r2 R2-H-5 — the WHOLE LANE
