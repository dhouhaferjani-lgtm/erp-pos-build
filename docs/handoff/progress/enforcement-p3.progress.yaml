    # postBatch (unreachable — validateRow scale-clamps and is the only writer that can
    # mark a row Valid), and the opening-balance pair (two legs from one variable).
    #
    # Key structural proof (census §1): the ONLY writers of status => Posted are the
    # chokepoint (GeneralLedgerService:3440) plus 6 direct creators; the DB column
    # defaults to 'draft'; JournalLineObserver freezes lines on chained entries; and
    # there is no insert/upsert/firstOrCreate/relation-create/raw-SQL vector. Therefore
