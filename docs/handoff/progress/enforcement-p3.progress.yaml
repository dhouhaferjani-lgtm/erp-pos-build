# M0 verifies, mechanically (gate-r1 C-1/H-1 encoding of "P3 after P1 lands"; hardened gate-r4 R4-H-5 —
# an ancestor + a candidate-editable status line alone is the partial-snapshot forgery class):
#   1. P1 WHOLE-PACKAGE precondition:
#      a. p1_landed_sha non-null and exists; git merge-base --is-ancestor <p1_landed_sha> <base_sha>
#      b. docs/handoff/progress/enforcement-p1.progress.yaml at base reads TOP-LEVEL `status: complete`,
#         with M3 (the whole-package gate) `status: passed`, a parseable ACCEPT verdict artifact at its
#         verdict: path (landed via the gate-r4 R4-C-1 extended post-promotion admin commit), and a
#         recorded commit
#      c. ancestry chain M3.commit -> p1_landed_sha -> base_sha (git merge-base --is-ancestor, each hop)
#      d. EVIDENCE BINDING — TWO SEPARATELY NAMED TAG PREDICATES (gate-r11 R11-H-1; a parseable
#         ACCEPT string alone proves nothing, registers are editable files):
#         d1. PIN TAG at A (name from P1's YAML mirror field dpa_baseline_pin_tag at base): resolves
#             to the landed accepted tip (git rev-parse <pin-tag>^{commit} == p1_landed_sha);
#             annotation accepted_sha == p1_landed_sha; EXACTLY ONE manifest_sha256 line matching
#             P1's dispatch manifest at base (via P1's control_manifest pin — gate-r9 R9-H-3,
#             gate-r10 R10-H-2); sha256 of the LANDED register file == the annotation's register
#             digest (gate-r5 R5-C-1); sha256 of the LANDED handback at the annotation's handback
#             path == handback_sha256, path present at base (gate-r6 R6-H-1); and the control_sha256
#             name set is exactly what the bridge emits — adversarial-review-final.sh, brief,
#             HARNESS, and every package lens (gate-r7 R7-C-1).
#         d2. CLOSE TAG at C (ci-close/enforcement-p1-r<n>): C DERIVED as the first-parent child of
#             p1_landed_sha (C^ == p1_landed_sha verified — gate-r6 R6-H-2); git diff-tree C^ C
#             contains every mandatory closing artifact and only P1's specific closing set (progress
#             YAML, reviews/ subtree, HANDBACK, LEDGER.md — nothing else); register+handback blobs at
#             P3's base EQUAL C's blobs; the close tag RESOLVES TO C (gate-r8 R8-M-1) and its
#             annotation is EXACTLY {closing_commit == C, closing_check == pass, accepted_sha ==
#             p1_landed_sha} (gate-r7 R7-C-2, gate-r9 R9-M-1) — the close tag carries NO
#             manifest/control lines; those live on the PIN tag only.
#   2. P2 WHOLE-PACKAGE precondition (gate-r3 R3-H-2/R3-H-3 — an M2-passed snapshot alone is the same
#       forgery class R2-H-5 closed for country defaults):
#       a. p2_landed_sha non-null + git merge-base --is-ancestor <p2_landed_sha> <base_sha>
#       b. docs/handoff/progress/enforcement-p2.progress.yaml at base reads TOP-LEVEL `status: complete`,
#          with M4 (the whole-package gate) `status: passed`, a parseable ACCEPT verdict artifact at its
#          verdict: path, and a recorded commit
#       c. ancestry chain M2.commit -> M4.commit (accepted tip) -> p2_landed_sha -> base_sha
#          (git merge-base --is-ancestor, each hop)
#       d. EVIDENCE BINDING, same TWO-PREDICATE shape as 1d (gate-r11 R11-H-1):
#          d1. P2's PIN TAG at A (i18n_baseline_pin_tag): resolves to p2_landed_sha; accepted_sha ==
