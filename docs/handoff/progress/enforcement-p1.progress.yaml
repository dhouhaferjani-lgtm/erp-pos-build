    red_run_regate_2026_08_20: "FIFTH REBASE / RED-RUN RE-GATE 2026-08-20 onto 9eef1f077 (not-a-fix-round; fix_rounds stays 9). The owner ran the pre-promotion workflow_dispatch on the round-11 tip. PARENT-REPORTED RESULT (this executor has no CI access by contract and reports it as received, not as verified): the backend-dpa-guard job executed GREEN — its FIRST live execution — alongside deptrac/pint/phpstan/types-drift/typecheck, and THREE unrelated gates failed red, all of the event-graph class and none belonging to this package: the section-14.3 chokepoint manifest anchor (the call had gone multiline), route-manifest drift on the merged tree, and a stale schema-default assertion in PendingSealMigrationTest. The parent fixed all three on dev at 9eef1f077 with true exit codes (T6 filter 83 passed / 0 failed on PG). Their diff is apps/api/scripts/saleReceipt-chokepoint-manifest.json, apps/api/tests/Feature/POS/Migrations/PendingSealMigrationTest.php and scripts/factory/manifests/routes-web.yaml — three paths, none under app/, so the scan corpus is untouched by construction and the census could not move; re-derived anyway and it did not (34/67/15, violation key set byte-identical to the baseline in both directions). Effects re-derived at the new tip and NOT carried: base_sha, the replayed seed c1bded36a (superseding the fourth rebase's 7dc0e5ca1, now dangling) and pins 78e1f08ac (superseding 1781f15b8), the M1/M2/M3 commit + updated pointers, and every M0 predicate (both ancestry hops exit 0; the S0 seam file is byte-identical across 41fb478c2..9eef1f077 so the anchors :1769/:1784/:1785/:1788 re-verify unchanged). UNCHANGED and verified: the protected blob 1381983d463e6c546535be907d4aa1c7ca94c597 (no re-seed, no re-pin, the owner-set repository variable does not move), the pre-allocated tag name, AND the control manifest digest c57416b8d0... — the fifth-rebase base does not touch the manifest, so neither the control_manifest mirror nor max_fix_rounds moves this time