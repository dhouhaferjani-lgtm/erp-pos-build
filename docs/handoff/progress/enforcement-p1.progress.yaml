#                                candidate; allocation ci-pin/enforcement-p1-r<n>, n = 1 + highest
#                                existing, collision = next n, never reuse). The OWNER creates the
#                                ANNOTATED tag at exactly A at promotion step 3, annotation binding
#                                {A, sha256(register(s)), sha256(handback), control_sha256 lines}
#                                (gate-r5 R5-C-1, gate-r7 R7-C-1);
#                                tags are NEVER deleted. CI fetches it explicitly (git fetch origin
#                                tag <tag>) before resolving the variable's blob.
# Bootstrap + every re-pin are OWNER writes at promotion time — variable + pin tag TOGETHER (brief §5
# item 4 steps 2-3 / §6 F-8); the parent updates this mirror block in the POST-promotion admin commit
# (gate-r3 R3-C-2). Never executor, never CI, never a candidate diff. LOCAL green runs export the
# reviewed seed blob under the same env name after asserting it equals the mirror; the unset negative
# case runs isolated via env -u (gate-r4 R4-H-4).
