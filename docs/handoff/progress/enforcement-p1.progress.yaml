    rebase_2026_08_20_manifest_repin: "FOURTH REBASE 2026-08-20 onto 28c84edb3 (not-a-fix-round per the standing ruling; the fix_rounds increment in this round is carried by the OWNER RULING recorded in stop_a_final_continuation_ruling, not by the rebase). The parent raised the control manifest p1 max_fix_rounds 8 -> 9 for the owner FINAL continuation; that raise is itself a dev commit (28c84edb3, one manifest-only commit atop the previously frozen tip e3eea67f9 - git diff --name-only e3eea67f9 28c84edb3 -> docs/handoff/enforcement-control-manifest.yaml, the single path), and the dispatch receipt was re-pinned to base_sha 28c84edb3 / manifest_sha256 c57416b8d0... . The parent declares this the LAST possible parent-side dev commit by construction: any further raise would be post-ACCEPT. Effects, all mechanically re-derived at the new tip and NOT carried: base_sha, the control_manifest mirror + top-level max_fix_rounds (both move together or neither is any use - the round-9 lesson), the replayed seed commit 85f0e63f3 -> 7dc0e5ca1 and pins commit 2b7dc05a6 -> 1781f15b8 (both of THOSE pointers were themselves superseded one rebase later - this field records the fourth rebase as it happened, not as it now reads; the live pointers are in red_run_regate_2026_08_20), the M1/M2 commit + updated pointers, and every M0 predicate. UNCHANGED, verified: the protected blob 1381983d463e6c546535be907d4aa1c7ca94c597 (git rev-parse HEAD:<baseline-path>), so NO re-seed and NO re-pin, and the owner-set repository variable does not move; the pre-allocated tag name ci-pin/enforcement-p1-r1; the census 34/67/15 with the violation key set byte-identical to the baseline in both directions; the S0 seam (StockAdjustmentService.php is byte-identical across e3eea67f9..28c84edb3 - the base adds only the control manifest). This is the fourth rebase of an already-accepted-then-stale A; the record family it disturbs is closed mechanically by the four sweeps, not instance by instance."
    rebase_2026_08_20_frozen_tip: "FINAL REBASE 2026-08-20 onto the FROZEN dev tip e3eea67f9 (not-a-fix-round; fix_rounds stays 7). Two dev commits landed, both closing the backend-analyse red this handback had reported: 437894ea9 applied the C-3 precision-ok comments and honestly corrected its own predecessor's false 'exit 0' claim (which had come from a piped exit code - the same measurement error this handback flagged), and e3eea67f9 root-caused the real defect - ForbidHardcodedBcmathScale read getFile() which returns the CONSUMER file for a trait-in-context, so precision-ok exemptions had never fired for ANY trait - fixed via getTraitReflection, with the Codex second reviewer credited for the root cause and a rule-test ticket filed. 35 commits replayed, no conflicts (dev's ci.yml untouched in both). The four sweeps absorbed the rebase in ONE pass: 35 moved commit identities substituted, anchors/counts/digests already clean; the seed pin auto-re-pointed to 85f0e63f3 and was re-verified as a true equivalent (exactly one file, ancestor of A, same blob 1381983d4), with the seed/pins two-commit topology still adjacent. BACKEND-ANALYSE IS NOW GENUINELY GREEN AT BASE - measured with the real exit code captured (set -o pipefail, not a piped tail): exit 0 [OK] No errors in BOTH the candidate worktree at A and the main checkout at e3eea67f9. C-3 is CLOSED, not waived, so 8.9's promotion blocker is resolved rather than carried. Census re-derived and byte-identical (34/67/15): the two commits touch CopiesDocumentData and a PHPStan rule, neither a contract-table writer."
