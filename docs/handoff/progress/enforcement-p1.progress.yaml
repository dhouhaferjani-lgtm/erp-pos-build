# TWO-PHASE PINNED-BASELINE PROTOCOL — NON-AUTHORITATIVE MIRROR pins (gate-r2 R2-C-1; authority moved
# gate-r3 R3-C-1, pin order fixed gate-r3 R3-H-4). The AUTHORITY the CI checker reads is the OWNER-SET
# repository variable DPA_BASELINE_PROTECTED_BLOB (the executor cannot write repo variables — no push,
# no credentials); these YAML fields are the paper-trail MIRROR, and mirror != variable = CI FAIL (drift
# tripwire, fail closed — as are unset variable and unfetchable blob object).
# Pin order INSIDE P1-M2 (gate-r3 R3-H-4 — pins land BEFORE the gate, the verdict covers them):
#   commit 1 = the dedicated seed commit generating the initial baseline;
#   commit 2 = these mirror pins recorded (+ any checker metadata);
#   ONLY THEN the M2 bridge review runs, covering both commits. A fix round regenerating the seed
#   recreates the SAME two-step topology (gate-r4 R4-H-3 — one commit cannot contain its own SHA):
#   seed-revision commit, then a DISTINCT metadata commit updating these mirrors, then BOTH re-reviewed;
#   a single self-identifying fix commit is forbidden.
#   dpa_baseline_seed_commit   = the dedicated seed commit that generated the initial baseline.
#   dpa_baseline_protected_blob = git rev-parse <seed_commit>:<baseline-path> — MIRROR of the variable.
#   dpa_baseline_pin_tag       = the PRE-ALLOCATED closing pin-tag NAME (gate-r5 R5-C-2 — recorded in
