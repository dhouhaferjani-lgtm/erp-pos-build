        real_path: apps/pos/src/components/pos/HeldTransactionsModal.tsx
        parity: [hold, recall, delete]
        status: todo
      - key: customer-picker
        desc: searchable name/phone, Client de passage, active highlight, + Nouveau client
        real_path: apps/pos/src/components/customers/CustomerSearchModal.tsx
        status: todo
      - key: add-customer
        desc: name/phone/email/skin-type/consent toggle; save+auto-select (skin_type = ticketed backend)
        real_path: apps/pos/src/components/customers/CustomerAttachPanel.tsx
        status: todo

  - id: P6
    name: Returns
    status: todo
    handoff: README 5.4
    note: handoff says VoidReturnModal but live flow is RefundCheckoutFlow (VoidReturnModal NOT mounted)
    items:
      - key: refund-flow
        desc: pick past ticket -> select return lines -> add replacements -> settle net via payment flow
        real_path: apps/pos/src/components/pos/RefundCheckoutFlow.tsx
        related: [ReceiptLocatorScreen.tsx, ReceiptScanConfirmationSheet.tsx, RefundDestinationPicker.tsx, RefundConfirmModal.tsx]
        parity: [pick-ticket, select-lines, add-items, settle-net]
        status: todo

  - id: P7
    name: Reports / Shift
    status: todo
    handoff: README 5.5
    items:
      - key: reports-menu
        desc: KPI cards (Ventes/Transactions/Panier moyen) + payment-method breakdown bars + ticket list (period segmented, payment filter, search)
        real_path: apps/pos/src/components/pos/ReportsMenu.tsx
        new_atoms: [KpiCard, BreakdownBar]
        status: todo
      - key: sales-history
        desc: filterable ticket list
        real_path: apps/pos/src/components/pos/TodaySalesPanel.tsx
        status: todo
      - key: x-report
        desc: service header, KPIs, breakdown, Imprimer rapport X
        real_path: apps/pos/src/components/pos/XReportModal.tsx
        status: todo
      - key: z-report-close
        desc: count cash, reconcile vs expected, live ecart color-coded, Cloturer
        real_path: apps/pos/src/components/pos/ZReportModal.tsx
        related: [CloseShiftModal.tsx, CashReconciliationSection.tsx]
        parity: [open-float, close-Z, reconciliation-ecart]
        status: todo
      - key: cash-movements
        desc: deposit/payout/drop-to-safe with amount+reason -> feeds Z
        real_path: apps/pos/src/components/pos/CashDrawerModal.tsx
        parity: [in, out, drop-to-safe]
        status: todo

  - id: P8
