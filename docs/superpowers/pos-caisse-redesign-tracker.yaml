    - ProductThumb      # tinted-initials tile + category tints + image fallback
    - Avatar            # initials disc (neutral/accent tone)
    - Stepper           # touch -/+ qty, 48px keys, onValueClick=numpad
    - Pill              # category toggle + removable filter chip
  todo:
    - ThemeToggle       # (settings sun/moon — partial: SegmentedControl in Appearance)
    - Toggle            # consent switch
    - Tab               # product-detail tabs
    - KpiCard           # reports
    - BreakdownBar      # reports payment-method bars
    - Divider           # header vertical group divider
    - ModalShell / FullScreenSheet / Drawer / Toast (shells; consolidate on pos/Modal.tsx)
