# IziPOS "Caisse Parapharmacie" Redesign — Screen Tracker
# Source of truth for redesign progress. One entry per surface from handoff README §5.
# real_path = the actual implementation file behind the organisms facade (verified in code).
# status: todo | in_progress | done | ticketed (backend dep)
# Always import surfaces via `@/components/organisms`; edit the real_path file.

meta:
  branch: feat/pos-caisse-redesign
  worktree: ../erp.pos-caisse
  base: origin/dev
  handoff: docs/design_handoff_pos_caisse/
  spec: docs/superpowers/specs/2026-06-27-pos-caisse-redesign-design.md
  app_root: apps/pos/src
  live_sell_page: apps/pos/src/pages/HomePage.tsx
  router: apps/pos/src/components/AppShell.tsx

phases:

  - id: P1
    name: Theme foundation
    status: done  # commit 85abcecac; tokens/fonts/provider/settings/stock-doc done + verified in-browser. EXCEPTION: displaymode-reconcile deferred to P3 (it is a P3 prerequisite, not needed until the grid restyle).
    consumed_by: all
    items:
      - key: tokens-semantic-layer
        desc: Split @theme into raw->semantic(--sem-*)->@theme; light + dark under [data-theme]
        real_path: apps/pos/src/index.css
        status: todo
      - key: tokens-accent
        desc: --accent/-strong/-tint/-ring/-text swapped by [data-accent]=orange|green|blue|teal; repoint --color-action* to accent
        real_path: apps/pos/src/index.css
        status: todo
      - key: tokens-corner
        desc: --r-panel/-card/-tile/-ctl/-sm/-pill swapped by [data-corner]=rounded|sharp
        real_path: apps/pos/src/index.css
        status: todo
      - key: tokens-stock
        desc: --stock-ok/-low/-out (+ surfaces) distinct from success/warning/danger; document exception
        real_path: apps/pos/src/index.css
        doc: apps/pos/docs/design-language.md
        status: todo
      - key: tokens-type-scale
        desc: ergonomic --text-* scale (POS 50-70cm) per spec §6 research
        real_path: apps/pos/src/index.css
        status: todo
      - key: fonts
        desc: self-host Montserrat(display)/Public Sans(sans)/IBM Plex Mono(mono), bundled @font-face, French subset; --font-display/-sans/-mono
        real_path: apps/pos/src/index.css
        assets: apps/pos/src/assets/fonts/ (new)
        status: todo
      - key: theme-provider
        desc: provider applies data-theme/-accent/-corner + density/cart vars to <html>; reads settingsStore
        real_path: apps/pos/src/components/ThemeProvider.tsx (new)
        mount: apps/pos/src/App.tsx
        status: todo
      - key: settings-store
        desc: add theme/accent/corner/density to settingsStore (persist izipos-settings); cartPosition already exists
        real_path: apps/pos/src/stores/settingsStore.ts
        status: todo
      - key: displaymode-reconcile
        desc: "PREREQUISITE (review): ProductGrid keeps own useState from localStorage 'pos-display-mode', ignoring settingsStore.displayMode (dual source of truth). Make grid read displayMode+density from settingsStore; migrate legacy key. Then density via getColumns(displayMode,density,width)+card-height consts (JS, not CSS var)."
        real_path: apps/pos/src/components/organisms/ProductGrid/ProductGrid.tsx
        blocks: [P3 product-grid density]
        status: todo
      - key: focus-ring-theme
        desc: "global *:focus-visible outline is hardcoded --theme-primary-500 (stays blue in dark/accent). Make accent/theme-aware in index.css."
        real_path: apps/pos/src/index.css
        status: todo
      - key: settings-appearance
        desc: Appearance section (SegmentedControls) in SettingsPage
        real_path: apps/pos/src/pages/SettingsPage.tsx
        status: todo

  - id: P2
    name: App shell + nav rail
    status: todo
    handoff: README 5.0
    items:
      - key: nav-rail
        desc: 88px rail opposite cart; Caisse/Clients/Rapports/Caisse-Shift icon+label; active=accent-tint; theme toggle bottom
        real_path: apps/pos/src/components/AppShell.tsx
        new_atoms: [NavRail, NavRailItem, ThemeToggle]
        status: todo
      - key: header
        desc: 62px; brand+Caisse1+online dot | shop+date(mono) | shift chip, sync, operator avatar+switch, lock/reports/settings ghost icons; vertical dividers
        real_path: apps/pos/src/components/Header.tsx
        new_atoms: [Divider, Avatar]
        status: todo

  - id: P3
    name: Sell screen (Caisse)
    status: todo
    handoff: README 5.1
    items:
      - key: transaction-cart
        desc: title+count badge+Vider; customer/loyalty card; quick actions (Remise/En attente/Reprendre+count); compact expandable lines; summary+checkout
        real_path: apps/pos/src/components/organisms/TransactionCart/TransactionCart.tsx
        new_molecules: [CartLine, QuickActions]
        parity: [add, increment, decrement, remove, clear, line-discount, cart-discount, totals+TVA, customer-attach, checkout-cash, checkout-mixte]
        status: todo
      - key: cart-line-expand
        desc: "USE MOCK (product decision 2026-06-28): collapsed by default (avatar, brand, name, xqty, line total, remove); TAP ROW BODY to expand -> qty stepper + per-line discount + fiche. Tap toggles expand (NOT increment). Accordion: one line expanded at a time -> more items fit on screen. Preserve onQuantityTap numpad in expanded state. Add behavior test (no current test)."
        real_path: apps/pos/src/components/molecules/CartLineItem/CartLineItem.tsx
        rationale: collapsed lines fit more cart items; edit still 1 tap away
        status: todo
      - key: payment-summary
        desc: Sous-total, Remises produits, Remise panier, dont TVA 19%, Total big mono
        real_path: apps/pos/src/components/pos/PaymentSummary.tsx
        status: todo
      - key: product-grid
        desc: 6/5 dense, 5/4 compact; density-driven; view toggle
        real_path: apps/pos/src/components/organisms/ProductGrid/ProductGrid.tsx
        status: todo
      - key: product-card
        desc: visual(tinted thumb 88px, info-eye, price mono, StockBadge, in-cart treatment+tap pulse) + compact
        real_path: apps/pos/src/components/molecules/ProductCard/ProductCard.tsx
        new_atoms: [ProductThumb, StockBadge]
        status: todo
      - key: toolbar
        desc: search left, Filtres(badge count), Top ventes toggle, view toggle Vignettes/Liste
        real_path: apps/pos/src/pages/HomePage.tsx
        new_atoms: [SegmentedControl(reuse)]
        status: todo
      - key: category-pills
        desc: horizontal multi-select pills; Tous clears
        real_path: apps/pos/src/components/organisms/ProductGrid/ProductGrid.tsx
        new_molecules: [CategoryPill]
        status: todo

  - id: P4
    name: Payment flows
    status: todo
    handoff: README 5.2
    items:
      - key: cash-screen
        desc: full-screen; navy summary (Total, Montant recu, Monnaie panel greens when covered); numpad+quick amounts+Valider
        real_path: apps/pos/src/components/organisms/CashPaymentScreen/CashPaymentScreen.tsx
        parity: [tendered, change-due, validate]
        status: todo
      - key: advanced-payments
        desc: 3-col method+repo / amount+numpad(prefill remaining) / total+lines+Finaliser; real getCompatibleRepositoryTypes
        real_path: apps/pos/src/components/organisms/AdvancedPaymentsModal/AdvancedPaymentsModal.tsx
        effort: high  # 916 lines, ~40 hardcoded colors, NOT in ESLint guard -> full detox + dark pass
        action: tokenize all hardcoded colors + add to eslint tokenMigratedGlobs
        parity: [multi-line, repository-rules, ref+last4, pay-remaining, finalize-when-covered]
        status: todo
      - key: card-modal
        desc: terminal sub-flow idle->processing->approved then drop line back
        real_path: apps/pos/src/components/pos/CardPaymentModal.tsx
        status: todo
      - key: checkout-success
        desc: ticket#, total, reglement, change; print + new sale
        real_path: apps/pos/src/components/pos/CheckoutSuccessModal.tsx
        status: todo

  - id: P5
    name: Cart-adjacent modals
    status: todo
    handoff: README 5.3
    items:
      - key: line-discount
        desc: product name + % grid (Aucune/5/10/15/20/25)
        real_path: apps/pos/src/components/organisms/LineDiscountModal/LineDiscountModal.tsx
        status: todo
      - key: cart-discount
