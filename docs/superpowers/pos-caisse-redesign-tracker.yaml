  - id: P9
    name: Parapharmacy merchandising (NEW surfaces)
    status: ticketed
    handoff: README 5.1 / 8
    items:
      - key: filters-drawer
        desc: advanced Filtres (brand/category/routine/skin); active filter chips row w/ removable + Tout effacer + live count
        real_path: apps/pos/src/pages/HomePage.tsx
