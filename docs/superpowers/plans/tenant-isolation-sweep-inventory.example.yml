# Tenant-Isolation Sweep — Inventory YAML Schema (Reference / Example)
#
# This file is the documented schema + a worked example for the live
# inventory at `docs/superpowers/plans/tenant-isolation-sweep-inventory.yml`
# (which is generated by `php artisan sweep:inventory:generate` per the
# master spec at `docs/superpowers/plans/2026-05-02-tenant-isolation-sweep.md`).
#
# It is the single source of truth for coordination between Claude Code and
# Codex during the sweep. Every callsite gets a unique id; agents claim,
# work, and resolve callsites by mutating their `status` and `owner` fields.
#
# Design constraints honored:
#   - Each callsite is independently actionable. No implicit ordering.
#   - Mutations are append-only where possible (status transitions are
#     explicit; old values move into `history`).
#   - Diff-friendly: one callsite per top-level array element, sorted by id,
#     so PR review can spot drift.
#   - Schema-validated: the master spec includes a JSON Schema we run in CI
#     to reject malformed mutations.
#
# Never edit by hand if you can avoid it. Use the artisan commands defined
# in the master spec (`sweep:inventory:claim`, `sweep:inventory:resolve`,
# `sweep:inventory:block`).

metadata:
  spec_version: "2026-05-02"
  spec_path: "docs/superpowers/plans/2026-05-02-tenant-isolation-sweep.md"
  branch: "fix/tenant-isolation"
