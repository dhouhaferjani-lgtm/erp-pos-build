# Coordination protocol (commands defined in master spec):
#
#   php artisan sweep:inventory:generate
#     -- Scans the codebase, populates callsites[] with everything found.
#        Idempotent: re-running merges new findings into the existing file
#        without losing status/owner state on already-claimed callsites.
#
#   php artisan sweep:inventory:claim --agent=codex --cluster=document
#     -- Codex (or Claude) claims a cluster. Sets owner+claimed_at on all
#        callsites in that cluster. Refuses if cluster is already owned
#        by another agent.
#
#   php artisan sweep:inventory:resolve --id=api.document.001 --commit=<sha> --test=<path::name>
#     -- Marks a callsite fixed. Records the commit SHA + the regression test.
#        CI checks the commit actually exists and the test exists+passes.
#
#   php artisan sweep:inventory:block --id=api.document.005 --reason="..."
#     -- Marks a callsite blocked with a reason. Triggers a review prompt.
#
#   php artisan sweep:inventory:status
#     -- Prints the current progress aggregate to stdout. CI uses this for
#        per-PR progress reporting.
#
# All commands validate the YAML against the JSON Schema embedded in the
# master spec before mutating, and refuse to write malformed state.
