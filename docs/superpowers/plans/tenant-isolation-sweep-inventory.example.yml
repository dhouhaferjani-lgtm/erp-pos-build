  generated_at: "2026-05-02T00:00:00Z"
  generated_by: "claude" # or "codex"
  schema_version: "1"

# Each agent declares its capabilities and what it's allowed to claim.
# Used by `sweep:inventory:claim` to validate the requesting agent.
agents:
  claude:
    role: "lead, plan, review, complex refactors, reference cluster execution, super-admin/security boundary"
    can_claim: ["*"]  # All clusters
    can_review: ["*"]
  codex:
    role: "mechanical per-cluster sweeps, adversarial review, regression test scaffolding"
    can_claim: ["api.*", "web.*", "tauri.*"]  # not meta tasks
    can_review: ["api.*", "web.*", "tauri.*"]

