    file: apps/api/app/Modules/Compliance/Presentation/Controllers/Nf525ExportController.php
    line: 150
    symbol: 'App\Modules\Compliance\Presentation\Controllers\Nf525ExportController::reprintLog'
    pattern_type: trusts_request_input_company_id
    resource: receipt_prints
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: true
    cross_module: false
    expected_fix: "Resolve companyId from CompanyContext->requireCompanyId(); drop body/query company_id from validator."

  # api.compliance — round-1 Opus Finding 2 (AuditController missing middleware/permission/CompanyContext)
  - cluster_id: api.compliance
    slug: audit-controller-index-trusts-x-company-id-header
    file: apps/api/app/Modules/Compliance/Presentation/Controllers/AuditController.php
    line: 25
    symbol: 'App\Modules\Compliance\Presentation\Controllers\AuditController::index'
    pattern_type: trusts_x_company_id_header
    resource: audit_events
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Inject CompanyContext via constructor; replace getCompanyId() with requireCompanyId(); add SetPermissionsTeam middleware + can:compliance.view_reprint_log gate to legacy routes in ComplianceServiceProvider."

  - cluster_id: api.compliance
    slug: audit-controller-anomalies-trusts-x-company-id-header
    file: apps/api/app/Modules/Compliance/Presentation/Controllers/AuditController.php
    line: 73
    symbol: 'App\Modules\Compliance\Presentation\Controllers\AuditController::anomalies'
    pattern_type: trusts_x_company_id_header
    resource: audit_events
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Inject CompanyContext via constructor; replace getCompanyId() with requireCompanyId()."

  # api.compliance — round-2 Opus Finding A (AuditService::getEventsForAggregate unscoped)
  - cluster_id: api.compliance
    slug: audit-service-get-events-for-aggregate-unscoped
    file: apps/api/app/Modules/Compliance/Services/AuditService.php
    line: 80
    symbol: 'App\Modules\Compliance\Services\AuditService::getEventsForAggregate'
    pattern_type: service_method_unscoped
    resource: audit_events
    expected_scope: company_only
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Add required string $companyId arg; lead query with where('company_id', $companyId). Treasury invariant: any service-tier method reachable from an HTTP route handler with a route-anchored param must take companyId as required input."

  # api.document — round-1 Opus Finding A (DraftPersistenceService::addLinesBatch
  # is the unscoped twin of api.document.012/013 — the inventory only flagged
  # the single-line addLine path; the batch path was missed but is reachable via
  # the no-permission /auto-save route with no FormRequest validator)
  - cluster_id: api.document
    slug: draft-persistence-add-lines-batch-product-unscoped
    file: apps/api/app/Modules/Document/Domain/Services/DraftPersistenceService.php
    line: 422
    symbol: 'App\Modules\Document\Domain\Services\DraftPersistenceService::addLinesBatch'
    pattern_type: unscoped_eloquent_whereIn
    resource: Product
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Scope Product::whereIn by document tenant_id + companyId so foreign product names are not snapshotted into local draft lines via /auto-save batch path."

  - cluster_id: api.document
    slug: draft-persistence-add-lines-batch-service-unscoped
    file: apps/api/app/Modules/Document/Domain/Services/DraftPersistenceService.php
    line: 425
    symbol: 'App\Modules\Document\Domain\Services\DraftPersistenceService::addLinesBatch'
    pattern_type: unscoped_eloquent_whereIn
    resource: Service
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Scope Service::whereIn by document tenant_id + companyId so foreign service names are not snapshotted into local draft lines via /auto-save batch path."

  # api.document — round-2 Codex Finding 1 (DraftPersistence persists raw
  # foreign product_id/service_id when the scoped lookup misses; fixed by
  # writing $product?->id / $service?->id instead — addLine + addLinesBatch)
  - cluster_id: api.document
    slug: draft-persistence-persists-raw-foreign-product-service-fk
    file: apps/api/app/Modules/Document/Domain/Services/DraftPersistenceService.php
    line: 239
    symbol: 'App\Modules\Document\Domain\Services\DraftPersistenceService::addLine'
    pattern_type: persists_unverified_foreign_key
    resource: DocumentLine
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: true
    expected_fix: "Persist scoped Product/Service lookup result (?->id) into document_lines, not the raw request UUID. Same fix in addLinesBatch."
