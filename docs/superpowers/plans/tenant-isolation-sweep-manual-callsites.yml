# Tenant-Isolation Sweep — Manual Callsites Stub
#
# Source for the ManualScanner (master plan Section 5.5). Each entry below
# becomes one row in the live inventory at
# docs/superpowers/plans/tenant-isolation-sweep-inventory.yml on the next
# `php artisan sweep:inventory:generate` run.
#
# Manual rows have stable_key = `manual:<cluster_id>:<slug>` — never
# reproducible by a sha256-based scanner, so they survive regeneration.
# Cluster owners populate this file as they identify non-mechanical
# tenant-isolation gaps in their cluster (PlatformIntegration outbound
# payloads, broadcast channels, scheduled jobs, etc.).
#
# Required fields per entry:
#   - cluster_id          canonical id (e.g. "api.platform-integration")
#   - slug                lowercase-hyphenated identifier; unique per cluster
#   - file                relative path from repo root
#   - symbol              fully-qualified PHP symbol or descriptive string
#   - pattern_type        free-form scanner-pattern label
#   - expected_scope      one of tenant_and_company | tenant_only |
#                         company_only | parent_context | cross_tenant
#   - severity            high | medium | low
#   - expected_fix        one-sentence remediation guidance
#
# Optional fields:
#   - resource            table or model short name; null if not applicable
#   - fiscal_path         bool, defaults false
#   - cross_module        bool, defaults false
#   - surface             defaults "api"
#   - line                int line number, defaults null

manual_callsites:

  # api.document — round-1 Opus Finding A (DraftPersistenceService::addLinesBatch
  # is the unscoped twin of api.document.012/013 — the inventory only flagged
  # the single-line addLine path; the batch path was missed but is reachable via
  # the no-permission /auto-save route with no FormRequest validator)
  - cluster_id: api.document
    slug: draft-persistence-add-lines-batch-product-unscoped
    file: apps/api/app/Modules/Document/Domain/Services/DraftPersistenceService.php
    line: 422
    symbol: 'App\Modules\Document\Domain\Services\DraftPersistenceService::addLinesBatch'
    pattern_type: unscoped_eloquent_whereIn
    resource: Product
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Scope Product::whereIn by document tenant_id + companyId so foreign product names are not snapshotted into local draft lines via /auto-save batch path."

  - cluster_id: api.document
    slug: draft-persistence-add-lines-batch-service-unscoped
    file: apps/api/app/Modules/Document/Domain/Services/DraftPersistenceService.php
    line: 425
    symbol: 'App\Modules\Document\Domain\Services\DraftPersistenceService::addLinesBatch'
    pattern_type: unscoped_eloquent_whereIn
    resource: Service
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: false
    expected_fix: "Scope Service::whereIn by document tenant_id + companyId so foreign service names are not snapshotted into local draft lines via /auto-save batch path."

  # api.document — round-2 Codex Finding 1 (DraftPersistence persists raw
  # foreign product_id/service_id when the scoped lookup misses; fixed by
  # writing $product?->id / $service?->id instead — addLine + addLinesBatch)
  - cluster_id: api.document
    slug: draft-persistence-persists-raw-foreign-product-service-fk
    file: apps/api/app/Modules/Document/Domain/Services/DraftPersistenceService.php
    line: 239
    symbol: 'App\Modules\Document\Domain\Services\DraftPersistenceService::addLine'
    pattern_type: persists_unverified_foreign_key
    resource: DocumentLine
    expected_scope: tenant_and_company
    severity: high
    fiscal_path: false
    cross_module: true
    expected_fix: "Persist scoped Product/Service lookup result (?->id) into document_lines, not the raw request UUID. Same fix in addLinesBatch."

  # api.inventory — round-3 Opus INFO (EloquentWorkOrderRepository finder lacks tenant_id predicate; api.workshop's responsibility)
  - cluster_id: api.workshop
    slug: eloquent-work-order-repository-find-no-tenant-id
    file: apps/api/app/Modules/Workshop/WorkOrder/Infrastructure/Persistence/EloquentWorkOrderRepository.php
    symbol: 'App\Modules\Workshop\WorkOrder\Infrastructure\Persistence\EloquentWorkOrderRepository::findById|findForUpdate'
    pattern_type: missing_tenant_predicate
    resource: work_orders
    expected_scope: tenant_and_company
    severity: low
    fiscal_path: false
    cross_module: false
    expected_fix: "Repository finders only filter by company_id (controller checks company access). Add tenant_id predicate so a same-tenant cross-company access through a future caller path cannot leak. api.workshop cluster's responsibility — flagged here from the api.inventory round-3 Opus review."

  # api.inventory — round-4 Codex INFO (Workshop cross-module raw-FK patterns)
  - cluster_id: api.workshop
    slug: bundle-expansion-adapter-raw-find
    file: apps/api/app/Modules/Workshop/WorkOrder/Infrastructure/Adapters/BundleExpansionAdapter.php
    symbol: 'App\Modules\Workshop\WorkOrder\Infrastructure\Adapters\BundleExpansionAdapter::pricingModeOf|bundleName'
    pattern_type: unscoped_eloquent_find
    resource: ServiceBundle
    expected_scope: tenant_and_company
    severity: low
    fiscal_path: false
    cross_module: true
    expected_fix: "ServiceBundle::find($bundleId) is unscoped; Workshop should pass and use its own tenant/company scope when resolving cross-module bundle metadata."

  - cluster_id: api.workshop
    slug: document-generation-adapter-raw-find
    file: apps/api/app/Modules/Workshop/WorkOrder/Infrastructure/Adapters/DocumentGenerationAdapter.php
    symbol: 'App\Modules\Workshop\WorkOrder\Infrastructure\Adapters\DocumentGenerationAdapter'
    pattern_type: unscoped_eloquent_find
    resource: Document
    expected_scope: tenant_and_company
    severity: low
    fiscal_path: false
    cross_module: true
    expected_fix: "Document::find($wo->quote_document_id) is unscoped; scope by wo.tenant_id + wo.company_id."
