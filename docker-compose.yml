services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: autoerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoerp
      POSTGRES_USER: autoerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoerp_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoerp -d autoerp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autoerp_network

  # T6 Phase 0b — Connection pooling for DB-per-tenant.
  #
  # POOL_MODE=transaction is REQUIRED for database-per-tenant: session-mode
  # would pin a request to a single backend DB, breaking Stancl's per-request
  # DB switch. Transaction-mode multiplexes clients onto backend connections
  # per transaction; cross-transaction state (LISTEN/NOTIFY, session-level
  # prepared statements, advisory locks) does NOT persist — Laravel already
  # tolerates this with DB_PGBOUNCER=true (emulate-prepares).
  #
  # CREATE/DROP DATABASE issued by tenant signup/deprovision MUST bypass
  # PgBouncer (talk to autoerp_postgres directly). See
  # docs/operations/POST-FLIP-OPS.md for the operational recipe.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: autoerp_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: autoerp
      DB_PASSWORD: ${POSTGRES_PASSWORD:-autoerp_secret}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      SERVER_RESET_QUERY: DISCARD ALL
      ADMIN_USERS: autoerp
      STATS_USERS: autoerp
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoerp_network

  redis:
    image: redis:7-alpine
    container_name: autoerp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-autoerp_redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-autoerp_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autoerp_network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: autoerp_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-autoerp_meili_master_key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: true
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autoerp_network

  minio:
    image: minio/minio:latest
    container_name: autoerp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoerp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-autoerp_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autoerp_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local

networks:
  autoerp_network:
    driver: bridge
