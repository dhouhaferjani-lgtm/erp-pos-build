name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  # Belt-and-braces for the 2026-06-02 GitHub Node 20 deprecation. Future-
  # proofs this workflow against any new JS action added later that might
  # still target Node 20. Current actions are all Node 24 native. See L10.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
