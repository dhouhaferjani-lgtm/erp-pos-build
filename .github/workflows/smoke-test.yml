name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL to test against'
        required: false
        default: 'https://erp.otospex.dev'

concurrency:
  group: smoke-tests
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  # Belt-and-braces for the 2026-06-02 GitHub Node 20 deprecation. Forces
  # any JS-runtime action still on `using: node20` (currently
  # actions/upload-artifact@v4) to run under Node 24 once GitHub flips
  # the runtime kill switch. See L10 in
  # docs/follow-ups/2026-04-28-q2-release-deferred-items.md.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  smoke:
    name: Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm exec playwright test --config=playwright.smoke.config.ts
        env:
          STAGING_URL: ${{ inputs.staging_url || 'https://erp.otospex.dev' }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
