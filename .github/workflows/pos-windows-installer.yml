# Builds the IziPOS desktop installer for Windows (NSIS .exe) on a GitHub-hosted runner.
# Triggered by pushing a branch named build/pos-windows-* or manually (workflow_dispatch).
# The API URL is baked into the bundle at build time (Vite env), so one build = one target server.
name: pos-windows-installer

on:
  push:
    branches: ['build/pos-windows-**']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL baked into the installer (no trailing slash, no /api/v1)'
        required: true
        default: 'https://api.erp.otospex.dev'
      reverb_host:
        description: 'Reverb WebSocket host (terminal activation push; polling fallback exists)'
        required: false
        default: 'api.erp.otospex.dev'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VITE_API_URL: ${{ github.event.inputs.api_url || 'https://api.erp.otospex.dev' }}
      VITE_REVERB_HOST: ${{ github.event.inputs.reverb_host || 'api.erp.otospex.dev' }}
      VITE_REVERB_PORT: '443'
      VITE_REVERB_SCHEME: 'https'
      VITE_REVERB_APP_KEY: ${{ secrets.STAGING_REVERB_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pos/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build IziPOS (NSIS installer)
        run: pnpm --filter @autoerp/pos tauri build --bundles nsis
        shell: bash

      - name: Record build facts
        shell: bash
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "api_url: $VITE_API_URL"
            echo "built_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256:"
            sha256sum apps/pos/src-tauri/target/release/bundle/nsis/*.exe
          } | tee apps/pos/src-tauri/target/release/bundle/nsis/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: IziPOS-windows-installer-${{ github.run_number }}
          path: |
            apps/pos/src-tauri/target/release/bundle/nsis/*.exe
            apps/pos/src-tauri/target/release/bundle/nsis/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
