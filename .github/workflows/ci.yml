        #     2026-08-25): the ONLY pins on the single sanctioned path to a
        #     day-one cash float (the ACCOUNTING opening batch seeds the
        #     repository movement atomically with its GL leg, and refuses a
        #     till that already traded) and on the refusal of a cash-paid
        #     expense that names no repository. Both are money-lane guards on
        #     the first tenant's go-live path, and Feature/Expense is PARKED
        #     behind `vars.SELF_HOSTED_RUNNER_READY` — unnamed here the W4-10
        #     guard would execute on no event. Feature/Accounting IS live and
        #     runs as a whole; its class is named anyway so the two halves of
