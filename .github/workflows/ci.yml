  t6-phase0b-pgsql:
    name: T6 Phase 0b — database-per-tenant flip (PHPUnit + PostgreSQL)
    runs-on: ubuntu-latest
    # T6 Phase 0b GATE: the row-level -> database-per-tenant flip must be proven
    # on real PostgreSQL (per-tenant database creation, central Sanctum PAT,
    # cross-DB FK audit, fail-closed resolver) before merge to dev OR main —
    # SQLite cannot host any of these. Kept SEPARATE from the broader
    # backend-test-pgsql fiscal-invariant filter so this gate reflects ONLY the
    # Phase 0b surface and stays green independent of pre-existing fiscal debt.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.base_ref == 'dev' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment (PostgreSQL)
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env.testing
          # The single-connection test suite points `central` at the default DB.
          sed -i 's/DB_CENTRAL_DATABASE=.*/DB_CENTRAL_DATABASE=autoerp_test/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      - name: Run T6 Phase 0b PostgreSQL tests
        # phpunit-pgsql.xml forces DB_CONNECTION=pgsql. The flip test creates real
        # per-tenant databases (the POSTGRES_USER is the container superuser and
        # may CREATE/DROP DATABASE).
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: autoerp_test
          DB_CENTRAL_DATABASE: autoerp_test
          DB_USERNAME: autoerp
          DB_PASSWORD: secret
        run: |
          php artisan test -c phpunit-pgsql.xml \
            --filter='/\\(TenantStanclFlipTest|TenantDatabaseIsolationTest|TenantProvisioningServiceTest|TenantReferenceDataSeedingTest|CentralPersonalAccessTokenPhase0bTest|CentralConnectionTest|TenancyManagerConfigTest|TenantMigrationsLoadedInTestingTest|CrossDbForeignKeyAuditTest|PlanLimitsServiceTest|TenancyResolverFailClosedTest|PendingSealMigrationTest|DeviceLossIncidentTest|FiscalEventQuarantineTableTest|FiscalEventsImmutabilityTest|ReceiptChainRebuildTest)::/'

  treasury-spine-pgsql:
    name: Treasury Spine — PG-only invariants (PHPUnit + PostgreSQL)
    runs-on: ubuntu-latest
    # Wave 2C gate: the treasury spine's hardest guarantees are PG-native —
    # the forbid-balance-write trigger, the repository_movements immutability
    # trigger, GL-chain advisory locks, and real savepoints. Every test that
    # asserts one of these calls markTestSkipped() on the sqlite :memory:
    # fast loop (backend-test), so a broken trigger or lock ordering can be
    # green there while production breaks. This job forces the same
    # Feature/Unit suites onto a real Postgres service so they execute
    # instead of skipping.
    #
    # Trigger condition mirrors t6-phase0b-pgsql: runs on PR->dev, PR->main, and
    # workflow_dispatch, so this gate protects the spine while it is still being
    # merged into dev, not only the eventual dev -> main promotion. The
    # `github.ref == 'refs/heads/dev'` arm of the push clause is a no-op today —
    # this workflow's `on.push.branches` (top of file) is `[main]` only, so a
    # push event on `dev` never actually triggers this workflow at all; it's
    # kept only for parity with t6-phase0b-pgsql and to fail safe if the push
    # trigger is ever widened to include `dev`.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.base_ref == 'dev' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: autoerp_secret
          POSTGRES_DB: autoerp_treasury_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_treasury_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      BROADCAST_CONNECTION: 'null'
      # Set at job level, not per-step: every step in this job talks to
      # PostgreSQL (unlike backend-test-pgsql, which keeps one sqlite unit
      # step alongside its pgsql step and so scopes DB_CONNECTION there).
      # phpunit.xml pins DB_CONNECTION=sqlite via <env> without force="true",
      # so this real environment variable still takes precedence.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: autoerp_treasury_test
      DB_CENTRAL_DATABASE: autoerp_treasury_test
      DB_USERNAME: autoerp
      DB_PASSWORD: autoerp_secret
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment (PostgreSQL)
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_treasury_test/' .env.testing
          sed -i 's/DB_CENTRAL_DATABASE=.*/DB_CENTRAL_DATABASE=autoerp_treasury_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=autoerp_secret/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          # .env.example ships BROADCAST_CONNECTION=redis, which breaks bootstrap
          # because config/broadcasting.php has no "redis" connection defined.
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      # SERIAL EXECUTION IS LOAD-BEARING — DO NOT PARALLELIZE THESE STEPS OR
      # MATRIX THIS JOB. Two pgsql RefreshDatabase suites racing against the
      # same schema corrupt each other mid-run and throw fake 2BP01 errors
      # that look like real failures but aren't (verified 2026-07-09; see
      # the "pgsql CONCURRENCY RULE" note in .superpowers/sdd/progress.md).
      # Three separate sequential steps in one runner gives clean failure
      # attribution AND keeps the suites from ever touching the database
      # concurrently. If anyone is tempted to "optimize" this into a matrix
      # or a single parallel phpunit invocation: don't — it will produce
      # intermittent, non-reproducible CI red that has nothing to do with
      # the code under test.
      - name: PG-only invariants — Treasury Feature suite
        run: ./vendor/bin/phpunit tests/Feature/Treasury

      - name: PG-only invariants — Accounting Feature suite
        run: ./vendor/bin/phpunit tests/Feature/Accounting

      - name: PG-only invariants — Treasury Unit suite
        run: ./vendor/bin/phpunit tests/Unit/Treasury

  # ===========================================================================
  # O-29 / F-2 FEATURE LANES — the ~1 130 tests/Feature classes that ran nowhere
  # ===========================================================================
  #
  # The enforcement-P2 census found 1 329 Feature classes in 74 top-level groups
  # and only 326 reachable by ANY job on ANY event. The manifest
  # (apps/api/tests/feature-lane-manifest.json) made that hole loud and
  # un-growable; the owner ruling of 2026-08-21 (LEDGER O-29) funds the other
  # half — actually EXECUTING them.
  #
  # WHY SELF-HOSTED. The GitHub Actions monthly quota is EXHAUSTED (LEDGER S-17).
  # At the measured 6.24 s/class the laneless remainder is ~118 min of PHPUnit on
  # SQLite and ~3 h on PostgreSQL, per triggering event — a recurring hosted-minute
  # cost the repo cannot pay at any price today. Minutes on a self-hosted runner
  # are FREE (GitHub bills none), so these eight jobs target a repo-scoped runner
  # on the owner's own VPS. Light static gates stay on hosted runners.
  #
  # WHY EIGHT JOBS. One per module family, balanced on class count so no lane
  # dominates the wall clock (20-33 min each on PG). One STEP per group, never a
  # matrix and never one step listing several directories: the manifest checker
  # resolves each lane by prefix-matching its selector against a live `run:` line,
  # so a matrix expression or a multi-directory step would resolve to nothing and
  # the lane would be certified by a step that cannot be proven to run it.
  #
  # WHY THE FLAG. `runs-on: [self-hosted, …]` with no runner registered for those
  # labels does NOT skip — GitHub QUEUES the job until a matching runner appears
  # and only gives up after 24 h, so every PR would hang on eight permanently
  # pending checks. `vars.SELF_HOSTED_RUNNER_READY` is therefore the real switch:
  # while it is unset these jobs evaluate their `if:` to false and are cleanly
  # SKIPPED. `all-checks-pass` names them in ALLOW_SKIPPED_JOBS for exactly that
  # reason, and the manifest checker asserts the two sets are identical — see the
  # aggregate job at the bottom of this file.
  #
  # Owner ops to switch them on (design doc §7): provision the VPS, register a
  # repo-scoped ephemeral runner with labels `self-hosted,linux,x64,autoerp-heavy`,
  # then set the repository variable SELF_HOSTED_RUNNER_READY=true.
  # Until then, lanes run locally: scripts/run-feature-lane-local.sh <lane>.
  #
  # Design + partition table + runtime estimates + triage posture:
  #   docs/handoff/DESIGN-f2-feature-lane-execution-2026-08-21.md

  feature-lane-pos:
    name: Feature Lane — Sales & POS (self-hosted)
    # Parked until the owner flips SELF_HOSTED_RUNNER_READY. The event arm mirrors
    # all-checks-pass exactly, so this lane never sits `skipped` while the aggregate
    # runs with the flag on, and never costs a minute on the cheap PR->dev gate.
    if: ${{ vars.SELF_HOSTED_RUNNER_READY == 'true' && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, linux, x64, autoerp-heavy]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: autoerp_secret
          POSTGRES_DB: autoerp_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      BROADCAST_CONNECTION: 'null'
      # Real PostgreSQL, like treasury-spine-pgsql: phpunit.xml pins
      # DB_CONNECTION=sqlite via <env> WITHOUT force="true", so this real
      # environment variable wins and the PG-only tests execute instead of
      # markTestSkipped-ing. Set at job level because every step here is a DB step.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: autoerp_pos_test
      DB_CENTRAL_DATABASE: autoerp_pos_test
      DB_USERNAME: autoerp
      DB_PASSWORD: autoerp_secret
      # First-execution triage: skip exactly the targets enumerated in
      # apps/api/tests/quarantine.json, each with a lane, a reason and an open
      # date, total pinned by a shrink-only ceiling the manifest checker enforces.
      AUTOERP_QUARANTINE: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment (PostgreSQL)
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_pos_test/' .env.testing
          sed -i 's/DB_CENTRAL_DATABASE=.*/DB_CENTRAL_DATABASE=autoerp_pos_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=autoerp_secret/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          # .env.example ships BROADCAST_CONNECTION=redis, which breaks bootstrap
          # because config/broadcasting.php has no "redis" connection defined.
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      # SERIAL EXECUTION IS LOAD-BEARING — DO NOT PARALLELIZE THESE STEPS OR MATRIX
      # THIS JOB. Two pgsql RefreshDatabase suites racing against the same schema
      # corrupt each other mid-run and throw fake 2BP01 errors (verified 2026-07-09;
      # see the pgsql CONCURRENCY RULE note on treasury-spine-pgsql above). One step
      # per group also gives clean failure attribution and is what the lane manifest
      # resolves against. Trailing slashes are load-bearing too: lane resolution is a
      # prefix match, and `tests/Feature/Service` would also match the `…/Services`
      # step (likewise Migration/Migrations), which the checker rejects as ambiguous.
      - name: Feature lane Sales & POS — tests/Feature/POS
        run: ./vendor/bin/phpunit tests/Feature/POS/
      - name: Feature lane Sales & POS — tests/Feature/Cart
        run: ./vendor/bin/phpunit tests/Feature/Cart/
      - name: Feature lane Sales & POS — tests/Feature/Voucher
        run: ./vendor/bin/phpunit tests/Feature/Voucher/
      - name: Feature lane Sales & POS — tests/Feature/Loyalty
        run: ./vendor/bin/phpunit tests/Feature/Loyalty/
      - name: Feature lane Sales & POS — tests/Feature/Coupon
        run: ./vendor/bin/phpunit tests/Feature/Coupon/
      - name: Feature lane Sales & POS — tests/Feature/Promotion
        run: ./vendor/bin/phpunit tests/Feature/Promotion/
      - name: Feature lane Sales & POS — tests/Feature/Progression
        run: ./vendor/bin/phpunit tests/Feature/Progression/
      - name: Feature lane Sales & POS — tests/Feature/Pricing
        run: ./vendor/bin/phpunit tests/Feature/Pricing/
      - name: Feature lane Sales & POS — tests/Feature/SmartPrompts
        run: ./vendor/bin/phpunit tests/Feature/SmartPrompts/

