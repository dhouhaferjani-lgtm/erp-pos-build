        #     SupplierInvoiceApiTest is deliberately NOT named (3 inherited PG
        #     reds). Remove when the gate flips. S-17 CAVEAT: unobserved in CI.
        #   - ExpensePaidFromRepositoryTest + OpeningCashFloatSeedsRepositoryTest
