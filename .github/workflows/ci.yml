          # UNFALSIFIABLE — i.e. each test passed with or without its fix:
          #   - the payload.invoice_id / payload.invoiced_at guards: SQLite has no
          #     `uuid` type, so binding a dirty value simply matches nothing instead
          #     of raising 22P02;
          #   - postgresPayloadObjectSql(): the SQLite branch uses `json_patch`,
          #     which already replaces a non-object base;
          #   - assertMatchingFinalisedPairs's `::text` cast: PostgreSQL-only by
          #     construction.
          # This wave has already seen the unguarded-uuid class recur four times
          # (M3-r1 finding 5, M4-r1 finding 2, F-1, F-T2), so the guards need a gate
