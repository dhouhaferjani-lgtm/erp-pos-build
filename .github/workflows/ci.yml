name: CI

on:
  push:
    branches: [main]              # post-merge confirmation only
  pull_request:
    branches: [main, dev]         # cheap checks on PR→dev; full pipeline on PR→main
  workflow_dispatch:              # manual full run from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  # Belt-and-braces for the 2026-06-02 GitHub Node 20 deprecation. Forces
  # any JS-runtime action still on `using: node20` (currently
  # actions/upload-artifact@v4) to run under Node 24 once GitHub flips
  # the runtime kill switch. Actions already on `using: node24` (v5+ bumps
  # in this PR) are unaffected. See L10 in
  # docs/follow-ups/2026-04-28-q2-release-deferred-items.md.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend-lint:
    name: Backend Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: ./vendor/bin/pint --test

  chokepoint-gate:
    name: §14.3 Chokepoint Completeness Gate
    runs-on: ubuntu-latest
    # Spec v7 §14.3 — every ->createReceipt( and ->finalize( call site
    # under apps/api/app + apps/api/routes MUST be reconciled against
    # apps/api/scripts/saleReceipt-chokepoint-manifest.json. The shell
    # gate (apps/api/scripts/check-saleReceipt-chokepoints.sh) is the
    # primary enforcement; ChokepointCompletenessTest (run in the
    # backend-test-pgsql merge gate) mirrors it at the PHPUnit layer
    # for defense in depth. Both must be green to merge.
    #
    # The job is intentionally light — no PHP toolchain required, just
    # ripgrep + jq + bash. Runs on every PR + push.
    #
    # Round-3 (Task 30 T30-R2-P1 fix): the receiver_type validator
    # invocation inside the shell gate (php verify-chokepoint-manifest.php)
    # is conditionally skipped when no `php` / vendor/autoload.php is
    # available (controlled via SKIP_RECEIVER_TYPE_VALIDATOR=1). The
    # full PHP validator runs in the backend-test-pgsql merge gate
    # (which already has PHP + composer + vendor installed) as part of
    # ChokepointCompletenessTest — defense-in-depth without bloating
    # the lightweight feedback loop with a composer install.
    steps:
      - uses: actions/checkout@v5

      - name: Install ripgrep + jq
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      - name: Run §14.3 chokepoint gate (shell layer only)
        env:
          SKIP_RECEIVER_TYPE_VALIDATOR: '1'
        run: bash apps/api/scripts/check-saleReceipt-chokepoints.sh

      - name: Run ACCOUNT_CHARGE chokepoint gate
        run: bash apps/api/scripts/check-accountCharge-chokepoints.sh

      # Task 27B Pass 2A.TS — Pass 2B sequencing sentinel.
      # While `apps/pos/src/lib/offline/.PASS_2B_PENDING` exists, any PR
      # that wires `FiscalEventEngine` into the device-side checkout path
      # (receiptService.ts / paymentStore.ts) is rejected. Pass 2B must
      # atomically remove the marker AND add the wiring in the same commit.
      # See synthesis v5 §8.A + Codex N-25 closure.
      - name: Run Pass 2B sequencing sentinel
        run: bash apps/pos/scripts/check-pass-2b-pending.sh

  backend-analyse:
    name: Backend Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Loads apps/api/phpstan.neon, which registers the precision rules
      # (ForbidFloatCastOnDecimalProperty, ForbidHardcodedBcmathScale) and the
      # phpstan-baseline.neon that absorbs pre-existing legacy hits. New
      # violations above the baseline fail the build. Memory bumped to 2G:
      # parseModelCastsMethod + the extra rules raise peak usage past 1G.
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=2G

  backend-architecture:
    name: Backend Architecture Boundary (Deptrac ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check tests/Feature CI-lane manifest
        # 2(b). tests/Feature reaches CI through three whole-directory steps and
        # two hand-maintained --filter allowlists, and nothing else: `backend-test`
        # runs `--testsuite=Unit`, never `--testsuite=Feature`. At this base that
        # leaves 990 of 1316 distinct Feature classes reachable by NO CI job on ANY
        # event, silently — a new class in an unlisted directory runs nowhere,
        # forever, and nothing says so.
        #
        # This checker fails on: a top-level group with no disposition in
        # tests/feature-lane-manifest.json (the property that cannot rot — a new
        # directory has no entry); a lane whose selector is absent from this
        # workflow (a lane cannot be a fiction); and any --filter entry that is
        # unanchored, dead, or ambiguous. It also prints the COVERAGE DEBT total on
        # every run so the deferred groups stay loud instead of silent.
        #
        # Static only — no database, no application boot (~1 s). It lives in this
        # job because `backend-architecture` has no `if:` guard and is already in
        # the all-checks-pass `needs` list, so no aggregate wiring is needed.
        run: php tools/feature-lane-manifest-check.php

      - name: Feature-lane checker liveness test
        # docs/conventions/08-DETECTOR-LIVENESS.md: every detector ships with a
        # test proving it FIRES on a planted violation, IN THE SAME CI LANE as the
        # detector. Every case drives COPIES of the tree in a temp dir — unanchored
        # filter, unquoted filter, commented-out lane selector, unassigned group,
        # coverage-debt growth, a lane misreporting its PR->dev coverage, and the
        # happy path. Deliberately a single FILE and not `tests/Architecture`: that
        # directory carries pre-existing failures this package does not own.
        # No database, no application boot (~1 s).
        run: ./vendor/bin/phpunit tests/Architecture/FeatureLaneManifestCheckerTest.php

      - name: Feature-lane local harness guards (destructive-run refusals)
        # gate-r2 R2-6. scripts/run-feature-lane-local.sh runs RefreshDatabase
        # suites, which DROP EVERY TABLE in the database they are pointed at, so its
        # refusals are a real control: non-loopback hosts, database names outside the
        # `autoerp_*test` throwaway pattern (including the DB_CENTRAL_* family, which
        # the `central` connection prefers over DB_*), and clamping the shared dev
        # postgres container. Those guards were previously verified by hand-run
        # probes pasted into a report and nothing re-ran them — which is not a
        # control. Every case here EXECUTES the real script with `--dry-run`, which
        # exits after the guards and before the first side effect: no docker, no
        # database, no application boot (~1 s).
        run: ./vendor/bin/phpunit tests/Architecture/FeatureLaneLocalHarnessTest.php

      - name: Event ratchets (orphaned events + projector emission — PR→dev lane)
        # ES wave A0's M5-r1 F-1 fold-in, ticketed to THIS package's ci.yml
        # reconciliation (parent ledger, es-A0 whole-lane F-1): the same two
        # ratchets also run in `backend-test`, but that job's `if:` skips PR→dev,
        # so on the day-to-day merge gate they gated NOTHING. This job has NO
        # `if:` guard, so the ratchets now fire on every event that starts the
        # workflow. Named files, not the whole tests/Architecture directory —
        # that directory carries unrelated inherited baseline failures (4, named
        # in the backend-dpa-guard job comment). Both are SQLite-safe: they read
        # source text and the live container; phpunit.xml self-carries APP_KEY
        # and the sqlite connection, so no extra env prep is needed here.
        run: ./vendor/bin/phpunit tests/Architecture/OrphanedEventRatchetTest.php tests/Architecture/ProjectorEmissionRatchetTest.php

      - name: Run Deptrac architecture ratchet
        # Static-analysis-only gate (~3-4 s). Hard-fails on hexagonal domain
        # leakage above baseline or any brand-new violation category; every
        # other category is ratcheted (may shrink/hold, never grow). See
        # docs/architecture/deptrac-baseline-2026-05-14.md.
        run: php tools/deptrac-ratchet.php --config=deptrac.yaml --baseline=deptrac.baseline.json

  backend-dpa-guard:
    name: Backend Document-per-Action Guard (DPA cementing ratchet)
    runs-on: ubuntu-latest
    # Static-analysis-only gate (~15 s): no database, no Redis, no app boot.
    #
    # NO `if:` guard — it runs on every event that actually starts this
    # workflow, and the true event graph is PR→main, PR→dev, push→main and
    # workflow_dispatch ONLY (see `on:` at the top of this file). A direct push
    # to `dev` never starts the workflow at all, so the promotion-path guarantee
    # is the owner's mandatory pre-promotion workflow_dispatch run on exactly
    # the accepted candidate SHA (docs/handoff/LEDGER.md §2 row S-14).
    #
    # The two DPA classes run BY PATH rather than via `--testsuite=Architecture`:
    # that suite is RED at this base for four unrelated, pre-existing failures
    # (AuthLifecycleTest, ConsoleCommandTenantContextTest,
    # ControllerTenantContextTest, QueueJobTenantContextTest), so wiring the
    # whole suite here would land a gate that is red on arrival. Widening this
    # job to the full suite is a follow-up for whoever closes those four.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the anti-growth ratchet resolves the owner-pinned
          # baseline blob out of the object store, and fetches the pin tag.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl
          coverage: none
          # Measured peak is ~443 MB and app/ only grows; pinned explicitly so a
          # future OOM cannot present as an undiagnosable red on the default.
          ini-values: memory_limit=1G

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Fetch the durable baseline pin tag
        working-directory: .
        run: |
          # `awk '{print $1}'` already drops the trailing `# …` comment; the
          # `tr` is defensive against a future quoted YAML value. Quote it as a
          # double-quoted string containing an escaped " and a ' — the earlier
          # '"'\'' form left an unterminated single quote that swallowed the
          # rest of the script (caught by the bash -n check in §7.3 Layer 1).
          PIN_TAG="$(sed -n 's/^dpa_baseline_pin_tag:[[:space:]]*//p' docs/handoff/progress/enforcement-p1.progress.yaml | head -1 | awk '{print $1}' | tr -d "\"'")"
          if [ -z "$PIN_TAG" ] || [ "$PIN_TAG" = "null" ]; then
            echo "::error::dpa_baseline_pin_tag is not recorded in the progress YAML — the owner-pinned baseline blob would have no durable ref. Failing closed."
            exit 1
          fi
          echo "Fetching pin tag: $PIN_TAG"
          git fetch --no-tags origin "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"

      - name: Document-per-action write guard (fixture matrix + liveness)
        run: |
          set -o pipefail
          ./vendor/bin/phpunit tests/Architecture/DocumentPerActionWriteGuardTest.php | tee guard.out
          grep -qE 'OK \([1-9][0-9]* test' guard.out || {
            echo "::error::the guard selected zero tests — phpunit exits 0 on an empty selection (phpunit.xml sets no failOnEmptyTestSuite), so this is asserted explicitly";
            exit 1; }

      - name: Document-per-action baseline ratchet (growth / stale / anti-growth)
        env:
          # OWNER-SET repository variable — the anti-growth ceiling, deliberately
          # outside every candidate diff. Unset => the ratchet fails closed,
          # which is the designed forcing function for the owner bootstrap.
          DPA_BASELINE_PROTECTED_BLOB: ${{ vars.DPA_BASELINE_PROTECTED_BLOB }}
        run: |
          set -o pipefail
          ./vendor/bin/phpunit tests/Architecture/DocumentPerActionBaselineRatchetTest.php | tee ratchet.out
          grep -qE 'OK \([1-9][0-9]* test' ratchet.out || {
            echo "::error::the ratchet selected zero tests"; exit 1; }

  backend-test:
    name: Backend Tests (PHPUnit)
    runs-on: ubuntu-latest
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    # Skipped on PR→dev — local preflight is the gate during dev iteration.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Static test APP_KEY — avoids needing `php artisan key:generate`, which
      # would also boot the full framework (including BroadcastManager) before
      # the test env overrides in phpunit.xml take effect.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      # Override the broadcasting driver because .env.example ships with
      # BROADCAST_CONNECTION=redis but config/broadcasting.php has no "redis"
      # connection defined, which makes any Laravel bootstrap blow up.
      BROADCAST_CONNECTION: 'null'
      # NOTE: Do NOT set DB_* env vars at the job level. phpunit.xml pins
      # DB_CONNECTION=sqlite (:memory:) for Unit tests, and PHPUnit 11's
      # <env/> directive does not override pre-existing environment variables
      # unless force="true" is set. The Postgres service remains available
      # for future Feature-suite coverage that opts into it explicitly.
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_CENTRAL_DATABASE=.*/DB_CENTRAL_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          # .env.example ships BROADCAST_CONNECTION=redis, which breaks bootstrap
          # because config/broadcasting.php has no "redis" connection defined.
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      # Note: phpunit.xml pins DB_CONNECTION=sqlite for the in-memory unit test
      # suite, so no Postgres migrations are required. The postgres service is
      # kept available for future feature-test coverage that requires pgsql.
      # APP_KEY is injected via job-level env so we don't need `key:generate`
      # (which would fail on the BroadcastManager the moment it boots the framework).
      - name: Run unit tests
        run: php artisan test --testsuite=Unit --coverage-clover=coverage.xml

      - name: PHPStan rule regression suite
        run: ./vendor/bin/phpunit tests/PHPStan

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

      # NOTE: the tests/Feature/Security step that used to live here MOVED to the
      # dedicated `security-regression` job (2026-08-19, parent ruling on brief
      # F-2 sub-decision). This job is `if:`-gated and skipped on PR→dev, so the
      # module-gating and kill-switch suite never ran on the day-to-day merge
      # gate. The new job has NO `if:` guard.

      # ES wave A0, M5 — the two program-wide EVENT RATCHETS. Named files, not
      # the whole tests/Architecture directory: that directory carries unrelated
      # inherited baseline failures (recorded in the A0 wave ledger — measured
      # 53 tests / 4 failures on the default driver at M5 round 1) and otherwise
      # runs ONLY in the manual-dispatch gate below.
      #
      # ⚠️ WHAT THIS STEP ACTUALLY GATES — read the JOB-level `if:` above, not
      # just this step. `backend-test` runs on **PR→main, push→main and
      # workflow_dispatch ONLY**; it is deliberately skipped on PR→dev, and a
      # push of local `dev` to `origin/dev` (the promotion path rule 21
      # prescribes) fires **no workflow at all** — `on:` triggers `push` for
      # `main` only. So these ratchets do NOT gate day-to-day `dev` work today.
      # Placing them here is still a real improvement (workflow_dispatch-only →
      # also PR→main / push→main), but the drift they exist to catch can land on
      # `dev` and only be caught at the `main` boundary.
      # Raised as M5 round 1, F-1. RESOLVED at the enforcement-P2 ci.yml
      # reconciliation (2026-08-21): the same two ratchets now ALSO run as a
      # step in `backend-architecture`, which has no `if:` guard, so they gate
      # PR→dev and every other event. This copy stays for the main-boundary
      # lanes' locality.
      #   OrphanedEventRatchetTest  — an event dispatched with zero registered
      #     listeners fires into nothing; the baseline enumerates the existing
      #     75 BY NAME and the check fails on the 76th.
      #   ProjectorEmissionRatchetTest — a registered FiscalEventProjector that
      #     writes a POS projection and emits no domain event is the T1 cutover
      #     blackout; the skip-list enumerates the existing 6 BY NAME, each
      #     annotated with the register row that will delete it.
      # Both are SQLite-safe: they read source text and the live container, no
      # PG-specific behaviour, no database rows.
      - name: Event ratchets (orphaned events + projector emission)
        run: ./vendor/bin/phpunit tests/Architecture/OrphanedEventRatchetTest.php tests/Architecture/ProjectorEmissionRatchetTest.php

      # Consent-gated support access changes the global middleware priority
      # ordering. A manual dispatch must therefore exercise every backend
      # testsuite in one CI environment before that branch can be promoted.
      - name: Full backend suite (manual security gate)
        # The repository's narrower Unit/Security lanes can carry unrelated
        # baseline failures. A manual security dispatch must still execute and
        # report the whole-suite result instead of silently skipping this gate.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          # A single 11k-test PHPUnit process exceeds the configured 2 GiB
          # memory limit before the suite completes. Partition only at the
          # top-level path boundary so every backend test still runs in this
          # job while PHPUnit releases process-local state between groups.
          mapfile -d '' feature_paths < <(
            find tests/Feature -mindepth 1 -maxdepth 1 -print0 | sort -z
          )
          test_paths=(
            tests/Unit
            "${feature_paths[@]}"
            tests/Integration
            tests/Architecture
            tests/PHPStan
          )
          status=0
          for test_path in "${test_paths[@]}"; do
            echo "::group::PHPUnit ${test_path}"
            if ! ./vendor/bin/phpunit "${test_path}"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  security-regression:
    name: Security Regression (module gating + kill-switches)
    runs-on: ubuntu-latest
    # NO `if:` GUARD — ON PURPOSE. tests/Feature/Security is the module/flag/
    # permission regression lane: per-module access control, the marketplace
    # kill-switch (both halves) and the first-tenant production security
    # contract. It is the surface CLAUDE.md rule 12 leans on.
    #
    # It used to be a step inside `backend-test`, which IS `if:`-gated and is
    # skipped on PR→dev — so these 17 classes never ran on the day-to-day merge
    # gate. Found by the enforcement-p2 lane census and ruled by the parent on
    # 2026-08-19 (brief §6 F-2 sub-decision): "RULED YES — move it onto the
    # PR→dev lane (+~43 s): it closes the rule-12 module-gating blind spot, is
    # trivially reversible, and its absence is a live safety gap rather than a
    # cost-policy question."
    #
    # Whole directory, not a --filter list, so new classes are gated the moment
    # they land. SQLite in-memory by design (phpunit.xml pins it): every test is
    # route/permission/config-level and needs no PG-specific behaviour, so this
    # job runs no database service.
    #
    # COST, stated honestly: the phpunit invocation alone is ~43 s (the figure the
    # parent ruling quoted), but this is a whole JOB — checkout + setup-php +
    # composer cache/install + env setup — so budget ~2-3 min of billed runner
    # time per triggering event, on every PR->dev, PR->main, push->main and
    # dispatch. The ruling stands on its merits (a live safety gap), but F-2 IS
    # the CI-minutes gate, so this number must not be understated.
    #
    # The manifest checker asserts this job has no `if:` guard — see
    # apps/api/tests/feature-lane-manifest.json (`runs_on_pr_dev: true`) and the
    # liveness case `test_it_fires_when_a_lane_misreports_its_pr_dev_coverage`.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment
        # .env.example ships BROADCAST_CONNECTION=redis, which breaks bootstrap
        # because config/broadcasting.php has no "redis" connection defined.
        # Same fix backend-test applies; no DB_* edits are needed because
        # phpunit.xml pins DB_CONNECTION=sqlite (:memory:).
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing
        env:
          APP_KEY: base64:71Dy19GJfnJyC8FcCpA0Z2YJ+7B68g/Rrv5e/QSe6xY=

      - name: Security regression suite (module gating + kill-switches)
        run: ./vendor/bin/phpunit tests/Feature/Security

  backend-test-pgsql:
    name: Backend Tests — PG-only invariants (PHPUnit + PostgreSQL)
    runs-on: ubuntu-latest
    # Gate 3: runs the append-only voucher_ledger trigger test, the CHECK
    # constraint allowlist test, and the fiscal hash-chain immutability tests
    # — all of which call `markTestSkipped` on SQLite.
    #
    # Heavy job: run the PG invariant lane on PR→dev as well as PR→main,
    # push→main, or manual workflow_dispatch so multi-location contracts are
    # merge-gated before the dev branch.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.base_ref == 'dev' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment (PostgreSQL)
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_CENTRAL_DATABASE=.*/DB_CENTRAL_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      # ChokepointCompletenessTest (in the filter below) shells out to `rg`
      # (ripgrep) to sweep the codebase for §14.3 fiscal chokepoints. Without
