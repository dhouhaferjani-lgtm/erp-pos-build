      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run TanStack query key audit
        run: pnpm audit:keys

      - name: Run design-system audit
        run: pnpm audit:design-system

      - name: Run quantity-display audit
        run: pnpm audit:quantity

      - name: Fetch the pinned i18n baseline revision
        # The i18n ratchet's anti-growth authority is the OWNER-SET repository
        # variable I18N_BASELINE_PROTECTED_BLOB, holding the git BLOB hash of
        # the gate-reviewed seed baseline — never the working file (which any
        # candidate can edit) and never a branch name (which moves).
        # actions/checkout fetches a single commit, so that blob is not in the
        # object store until we fetch the durable pin tag that reaches it. The
        # owner creates the tag at promotion, before dispatching CI, and pin
        # tags are NEVER deleted. A missing tag fails this step — fail-closed
        # by design. See CODEX-DISPATCH-enforcement-guards-2026-08-12.md §6 F-8.
        run: git fetch origin tag ci-pin/enforcement-p2-r1
        working-directory: .

      - name: Run i18n completeness gate (tools/audit-i18n-completeness.mjs)
        # Shrink-only per-locale key + CLDR-plural completeness, computed on
        # AUTHORED-LOCALE PROVENANCE (the per-locale source translation files).
        # The merged i18next `resources` object cannot be trusted: it aliases
        # 22 whole namespaces to English for `ar` and spread-merges English
        # keys underneath partial Arabic objects, so a scanner reading it
        # reports vacuous full parity.
        # DISCRETE STEP ON PURPOSE: this job does NOT run `pnpm lint` (the
        # ratchet step below supersedes it), so a lint-chain-only wiring would
        # ship a guard that never executes in CI — the exact
        # guard-exists-but-never-runs defect this package closes.
        # Fails closed on: unset variable · unfetchable blob · drift between
        # the variable and the non-authoritative progress-YAML mirror pin.
        env:
          I18N_BASELINE_PROTECTED_BLOB: ${{ vars.I18N_BASELINE_PROTECTED_BLOB }}
        run: pnpm audit:i18n

      - name: Run detector liveness suites (ESLint RuleTester + tools tamper tests)
        # docs/conventions/08-DETECTOR-LIVENESS.md: every detector ships with a
        # test proving it FIRES on a planted violation, in the SAME CI lane as
        # the detector. Both suites previously ran in NO workflow at all, so
        # every RuleTester and every tamper test in this repo was CI-dead —
        # including the ones guarding the precision contract (CLAUDE.md rule 19).
        # A discrete step in this job (rather than a new job) keeps them in the
        # detectors' own lane and inherits frontend-lint's all-checks-pass
        # membership, so no new `needs` entry is required.
        run: pnpm test:eslint-rules && pnpm test:tools

      - name: Run ESLint warning ratchet
        # Supersedes a raw `pnpm lint`: errors still hard-fail immediately,
        # and the per-app warning count is ratcheted against
        # scripts/lint-warning-baseline.json (may shrink/hold, never grow).
        # Runs from the repo root and covers both @autoerp/web and
        # @autoerp/pos. See docs/qa/lint-warning-ratchet-2026-05-14.md.
        run: pnpm lint:ratchet
        working-directory: .

  frontend-typecheck:
    name: Frontend Type Check (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run TypeScript check
        run: pnpm typecheck

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run tests
        run: pnpm test

  pos-test:
    name: POS Tests (Vitest)
    runs-on: ubuntu-latest
    # Gate 1 (TS fixture-integrity) and Gate 2 (cross-language fixture sync)
    # live in apps/pos. This job is the merge gate that runs them.
    # Runs on EVERY pull request (not just PR→main): POS regressions reached
    # dev unverified (e.g. PR #177's CustomerAttachPanel break) because this was
    # previously main-only. POS Vitest is cheap (~2 min) and also catches POS
    # breakage caused by shared-package changes outside apps/pos.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run tests
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  route-manifest-drift:
    name: Route Manifest Drift Guard
    runs-on: ubuntu-latest
    # Intentionally lean: the generator needs the workspace's js-yaml and
    # apps/web TypeScript installs, but no .env, database, Redis, or build.
    # No job-level `if:` means this guard runs on every workflow event.
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check route manifest drift
        run: bash scripts/factory/check-manifest-drift.sh

  types-drift:
    name: Generated Types Drift Guard
    runs-on: ubuntu-latest
    # Intentionally lean: no .env, no APP_KEY, no Postgres, no Redis.
    # `php artisan typescript:transform` is pure reflection — it loads the
    # service-provider graph but never opens a DB/Redis connection. If this
    # job ever fails with a connection error, audit recent service-provider
    # changes for lazy-boot paths that hit infrastructure.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Regenerate TypeScript types
        run: php artisan typescript:transform

      - name: Fail if generated.d.ts is out of sync
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --quiet -- packages/shared/types/generated.d.ts; then
            echo "::error::packages/shared/types/generated.d.ts is out of date. A #[TypeScript]-tagged PHP DTO changed without a matching regen."
            echo ""
            echo "To fix:"
            echo "  (cd apps/api && php artisan typescript:transform)"
            echo "  git add packages/shared/types/generated.d.ts"
            echo "  git commit -m 'chore(types): regenerate TypeScript types'"
            echo ""
            echo "Diff summary:"
            git --no-pager diff --stat -- packages/shared/types/generated.d.ts
            echo ""
            echo "First 200 lines of the diff:"
            git --no-pager diff -- packages/shared/types/generated.d.ts | head -200
            exit 1
          fi

      - name: Regenerate frontend permission map
        run: php artisan permissions:export-frontend-map

      - name: Fail if frontend permission map is out of sync
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --quiet -- apps/web/src/hooks/permissionsMap.generated.ts; then
            echo "::error::apps/web/src/hooks/permissionsMap.generated.ts is out of date. RolesAndPermissionsSeeder changed without a matching regen."
            echo ""
            echo "To fix:"
            echo "  (cd apps/api && php artisan permissions:export-frontend-map)"
            echo "  git add apps/web/src/hooks/permissionsMap.generated.ts"
            echo ""
            echo "Diff summary:"
            git --no-pager diff --stat -- apps/web/src/hooks/permissionsMap.generated.ts
            echo ""
            echo "First 200 lines of the diff:"
            git --no-pager diff -- apps/web/src/hooks/permissionsMap.generated.ts | head -200
            exit 1
          fi

  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    # Only meaningful when the heavy jobs ran. Skipped on PR→dev.
    #
    # treasury-spine-pgsql is included below: its `if:` (workflow_dispatch ||
    # base_ref==main || base_ref==dev || push to main/dev) is a STRICT SUPERSET
    # of this job's own `if:` (workflow_dispatch || base_ref==main || push to
    # main) — every event where all-checks-pass's `if` is true also makes
    # treasury-spine-pgsql's `if` true, so it always actually RUNS (never sits
    # `skipped`) whenever this job evaluates its `needs`. A `needs` entry whose
    # job comes back `skipped` would otherwise fail/skip this aggregate gate
    # spuriously — confirmed that can't happen here before wiring it in.
    #
    # O-29 (2026-08-21): `always() &&` was added in front of the original event
    # condition, and the aggregate now EVALUATES its dependencies' results in a
    # step instead of leaning on GitHub's implicit "skip me if any need did not
    # succeed". Two reasons, both load-bearing:
    #
    #   1. The eight self-hosted Feature lanes are guarded by
    #      `vars.SELF_HOSTED_RUNNER_READY` and are legitimately SKIPPED until the
    #      owner flips it. Under the implicit rule ONE skipped dependency skips
    #      this aggregate — the required check would go permanently unfulfilled.
    #   2. The implicit rule is also weaker than it looks the other way: when a
    #      dependency FAILS, this job is SKIPPED rather than failed, and a skipped
    #      required check is not a red one. Evaluating results explicitly makes a
    #      failed dependency fail THIS job, out loud.
    #
    # Tolerance is enumerated, never wildcarded: ALLOW_SKIPPED_JOBS lists exactly
    # the flag-gated lane jobs, any OTHER skipped dependency is a hard failure,
    # and tools/feature-lane-manifest-check.php asserts that this list is
    # identical to the set of lanes declaring an `execution_gate`. Adding a name
    # here to quiet a red job therefore fails the manifest checker.
    if: always() && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # route-manifest-drift has no `if:` guard, so it always runs and can never
    # enter this aggregate gate as a skipped dependency.
    #
    # backend-dpa-guard is included below on exactly the same reasoning: it
    # carries NO `if:` at all, so on every event that starts this workflow it
    # ALWAYS RUNS and can never come back `skipped`. A `needs` entry whose job is
    # skipped would fail/skip this aggregate spuriously — an unconditional job
    # cannot, so adding it is safe by the same argument already made above for
    # treasury-spine-pgsql. A guard visible in CI but absent from this list is
    # not merge-gating.
    needs: [backend-lint, backend-analyse, backend-architecture, backend-dpa-guard, backend-test, backend-test-pgsql, security-regression, treasury-spine-pgsql, feature-lane-pos, feature-lane-fiscal-finance, feature-lane-inventory, feature-lane-catalog, feature-lane-documents, feature-lane-tenancy, feature-lane-data-console, feature-lane-platform-misc, frontend-lint, frontend-typecheck, frontend-test, pos-test, frontend-build, route-manifest-drift, types-drift]
    steps:
      - name: Verify every dependency succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # EXACTLY the flag-gated Feature-lane jobs. Verified for set-equality
          # against the manifest's `execution_gate` lanes by
          # apps/api/tools/feature-lane-manifest-check.php (backend-architecture,
          # ungated, in this same needs list).
          ALLOW_SKIPPED_JOBS: feature-lane-catalog,feature-lane-data-console,feature-lane-documents,feature-lane-fiscal-finance,feature-lane-inventory,feature-lane-platform-misc,feature-lane-pos,feature-lane-tenancy
          # EVERY job this gate aggregates — identical to `needs:` above, and
          # asserted identical by the manifest checker (B5a). This is what lets the
          # script tell "all dependencies succeeded" apart from "the needs context
          # was empty, truncated or unparseable": without it, an absent or malformed
          # NEEDS_JSON produced zero loop iterations and a green step (gate-r1 R1-1,
          # reproduced by the reviewer).
          EXPECTED_JOBS: backend-lint,backend-analyse,backend-architecture,backend-dpa-guard,backend-test,backend-test-pgsql,security-regression,treasury-spine-pgsql,feature-lane-pos,feature-lane-fiscal-finance,feature-lane-inventory,feature-lane-catalog,feature-lane-documents,feature-lane-tenancy,feature-lane-data-console,feature-lane-platform-misc,frontend-lint,frontend-typecheck,frontend-test,pos-test,frontend-build,route-manifest-drift,types-drift
        run: |
          set -o pipefail
          status=0
          tmp="${RUNNER_TEMP:-.}"

          # 1. PARSE, WITH THE EXIT CODE OBSERVED. The previous form piped jq into a
          #    process substitution, whose status is unobservable: a parse error just
          #    closed the stream, the loop ran zero times, and `status` was still 0.
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::All Checks Pass: the \`needs\` context is absent or not a JSON object. Refusing to pass."
            printf 'needs context was: %s\n' "${NEEDS_JSON:-<empty>}"
            exit 1
          fi
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value.result? // "<missing>")"' > "$tmp"/needs.tsv

          # 2. THE PARSED KEY SET MUST BE EXACTLY THE JOBS WE AGGREGATE. A non-empty
          #    but partial context (a truncated expression, a renamed job) would
          #    otherwise pass by simply not mentioning the failure.
          cut -f1 "$tmp"/needs.tsv | LC_ALL=C sort > "$tmp"/needs-jobs.txt
          printf '%s' "$EXPECTED_JOBS" | tr ',' '\n' | sed '/^$/d' | LC_ALL=C sort > "$tmp"/expected-jobs.txt
          parsed_count=$(wc -l < "$tmp"/needs-jobs.txt | tr -d ' ')
          if [ "$parsed_count" -eq 0 ]; then
            echo "::error::All Checks Pass: the \`needs\` context parsed to ZERO jobs. Refusing to pass."
            exit 1
          fi
          if ! diff -u "$tmp"/expected-jobs.txt "$tmp"/needs-jobs.txt > "$tmp"/jobs.diff; then
            echo "::error::All Checks Pass: the \`needs\` context does not match EXPECTED_JOBS (-expected/+actual):"
            cat "$tmp"/jobs.diff
            exit 1
          fi
          echo "aggregating $parsed_count dependencies"

          # 3. EVALUATE EACH RESULT.
          allowed=",${ALLOW_SKIPPED_JOBS},"
          while IFS=$'\t' read -r job result; do
            case "$result" in
              success)
                echo "ok        $job"
                ;;
              skipped)
                if [ "${allowed#*,"$job",}" != "$allowed" ]; then
                  echo "skipped   $job (allowed: parked behind SELF_HOSTED_RUNNER_READY)"
                else
                  echo "SKIPPED   $job — not an allowed skip; a dependency of this gate did not run"
                  status=1
                fi
                ;;
              *)
                echo "FAILED    $job — result=$result"
                status=1
                ;;
            esac
          done < "$tmp"/needs.tsv

          if [ "$status" -ne 0 ]; then
            echo "::error::All Checks Pass: at least one dependency did not succeed."
            exit 1
          fi
          echo "All CI checks have passed!"
