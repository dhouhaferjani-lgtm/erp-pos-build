name: CI

on:
  push:
    branches: [main]              # post-merge confirmation only
  pull_request:
    branches: [main, dev]         # cheap checks on PR→dev; full pipeline on PR→main
  workflow_dispatch:              # manual full run from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  # Belt-and-braces for the 2026-06-02 GitHub Node 20 deprecation. Forces
  # any JS-runtime action still on `using: node20` (currently
  # actions/upload-artifact@v4) to run under Node 24 once GitHub flips
  # the runtime kill switch. Actions already on `using: node24` (v5+ bumps
  # in this PR) are unaffected. See L10 in
  # docs/follow-ups/2026-04-28-q2-release-deferred-items.md.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend-lint:
    name: Backend Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: ./vendor/bin/pint --test

  chokepoint-gate:
    name: §14.3 Chokepoint Completeness Gate
    runs-on: ubuntu-latest
    # Spec v7 §14.3 — every ->createReceipt( and ->finalize( call site
    # under apps/api/app + apps/api/routes MUST be reconciled against
    # apps/api/scripts/saleReceipt-chokepoint-manifest.json. The shell
    # gate (apps/api/scripts/check-saleReceipt-chokepoints.sh) is the
    # primary enforcement; ChokepointCompletenessTest (run in the
    # backend-test-pgsql merge gate) mirrors it at the PHPUnit layer
    # for defense in depth. Both must be green to merge.
    #
    # The job is intentionally light — no PHP toolchain required, just
    # ripgrep + jq + bash. Runs on every PR + push.
    #
    # Round-3 (Task 30 T30-R2-P1 fix): the receiver_type validator
    # invocation inside the shell gate (php verify-chokepoint-manifest.php)
    # is conditionally skipped when no `php` / vendor/autoload.php is
    # available (controlled via SKIP_RECEIVER_TYPE_VALIDATOR=1). The
    # full PHP validator runs in the backend-test-pgsql merge gate
    # (which already has PHP + composer + vendor installed) as part of
    # ChokepointCompletenessTest — defense-in-depth without bloating
    # the lightweight feedback loop with a composer install.
    steps:
      - uses: actions/checkout@v5

      - name: Install ripgrep + jq
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      - name: Run §14.3 chokepoint gate (shell layer only)
        env:
          SKIP_RECEIVER_TYPE_VALIDATOR: '1'
        run: bash apps/api/scripts/check-saleReceipt-chokepoints.sh

      - name: Run ACCOUNT_CHARGE chokepoint gate
        run: bash apps/api/scripts/check-accountCharge-chokepoints.sh

      # Task 27B Pass 2A.TS — Pass 2B sequencing sentinel.
      # While `apps/pos/src/lib/offline/.PASS_2B_PENDING` exists, any PR
      # that wires `FiscalEventEngine` into the device-side checkout path
      # (receiptService.ts / paymentStore.ts) is rejected. Pass 2B must
      # atomically remove the marker AND add the wiring in the same commit.
      # See synthesis v5 §8.A + Codex N-25 closure.
      - name: Run Pass 2B sequencing sentinel
        run: bash apps/pos/scripts/check-pass-2b-pending.sh

  backend-analyse:
    name: Backend Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Loads apps/api/phpstan.neon, which registers the precision rules
      # (ForbidFloatCastOnDecimalProperty, ForbidHardcodedBcmathScale) and the
      # phpstan-baseline.neon that absorbs pre-existing legacy hits. New
      # violations above the baseline fail the build. Memory bumped to 2G:
      # parseModelCastsMethod + the extra rules raise peak usage past 1G.
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=2G

  backend-architecture:
    name: Backend Architecture Boundary (Deptrac ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Deptrac architecture ratchet
        # Static-analysis-only gate (~3-4 s). Hard-fails on hexagonal domain
        # leakage above baseline or any brand-new violation category; every
        # other category is ratcheted (may shrink/hold, never grow). See
        # docs/architecture/deptrac-baseline-2026-05-14.md.
        run: php tools/deptrac-ratchet.php --config=deptrac.yaml --baseline=deptrac.baseline.json

  backend-test:
    name: Backend Tests (PHPUnit)
    runs-on: ubuntu-latest
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    # Skipped on PR→dev — local preflight is the gate during dev iteration.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Static test APP_KEY — avoids needing `php artisan key:generate`, which
      # would also boot the full framework (including BroadcastManager) before
      # the test env overrides in phpunit.xml take effect.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      # Override the broadcasting driver because .env.example ships with
      # BROADCAST_CONNECTION=redis but config/broadcasting.php has no "redis"
      # connection defined, which makes any Laravel bootstrap blow up.
      BROADCAST_CONNECTION: 'null'
      # NOTE: Do NOT set DB_* env vars at the job level. phpunit.xml pins
      # DB_CONNECTION=sqlite (:memory:) for Unit tests, and PHPUnit 11's
      # <env/> directive does not override pre-existing environment variables
      # unless force="true" is set. The Postgres service remains available
      # for future Feature-suite coverage that opts into it explicitly.
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          # .env.example ships BROADCAST_CONNECTION=redis, which breaks bootstrap
          # because config/broadcasting.php has no "redis" connection defined.
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      # Note: phpunit.xml pins DB_CONNECTION=sqlite for the in-memory unit test
      # suite, so no Postgres migrations are required. The postgres service is
      # kept available for future feature-test coverage that requires pgsql.
      # APP_KEY is injected via job-level env so we don't need `key:generate`
      # (which would fail on the BroadcastManager the moment it boots the framework).
      - name: Run unit tests
        run: php artisan test --testsuite=Unit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

  backend-test-pgsql:
    name: Backend Tests — PG-only invariants (PHPUnit + PostgreSQL)
    runs-on: ubuntu-latest
    # Gate 3: runs the append-only voucher_ledger trigger test, the CHECK
    # constraint allowlist test, and the fiscal hash-chain immutability tests
    # — all of which call `markTestSkipped` on SQLite.
    #
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment (PostgreSQL)
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      # ChokepointCompletenessTest (in the filter below) shells out to `rg`
      # (ripgrep) to sweep the codebase for §14.3 fiscal chokepoints. Without
      # ripgrep the Symfony Process returns exit 127 and the test hard-fails —
      # this is the H5 CI red (the chokepoint-gate job installs ripgrep, this
      # job did not). The test MUST run in the merge gate, so install rg here.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run pgsql-only invariant tests
        # DB_CONNECTION=pgsql is set at the step level, NOT the job level.
        # phpunit.xml pins DB_CONNECTION=sqlite via <env> without force="true",
        # so a real environment variable here takes precedence and switches the
        # entire test run to use the PostgreSQL service container.
        #
        # Tests exercised:
        #   - VoucherLedgerTest (Unit): append-only trigger + CHECK constraint allowlist
        #     (calls markTestSkipped on SQLite — these are the exact tests Gate 3 targets)
        #   - VoucherLedgerAppendOnlyTest (Feature): Eloquent-level append-only guard
        #   - FiscalHardeningE2ETest (Feature): fiscal hash-chain immutability triggers
        #   - FiscalEventsTableTest (Feature, Task 7): PG-only schema invariants
        #     (JSONB CHECKs, unique indexes, FK shape) that skip on SQLite
        #   - FiscalEventsImmutabilityTest (Feature, Task 8): PG-only trigger
        #     semantics for the fiscal_events append-only ledger, including the
        #     gated `failed -> parsed` resume contract Task 24 depends on
        #   - FiscalEventProjectionsTableTest (Feature, Task 9): PG-only FK
        #     (fiscal_event_id → fiscal_events.id) + partial index for the
        #     worker dispatcher hot path (projection_status IN pending,running)
        #   - FiscalEventQuarantineTableTest (Feature, Task 10): PG-only
        #     Phase 1 single-value CHECK on integrity_exception_class, hash-
        #     format CHECKs, unresolved-incident partial index, and the
        #     information_schema column-type contract for §8 envelope columns
        #   - PosReceiptsCanonicalBytesTest (Feature, Task 11): PG-only FK
        #     pos_receipts.fiscal_event_id → fiscal_events(id) and BYTEA /
        #     nullability shape for the projection-row linkage anchor
        #   - PaymentsOriginColumnsTest (Feature, Task 12): PG-only FK
        #     payments.fiscal_event_id → fiscal_events(id) + column-type
        #     contract for the Treasury-module integration columns
        #   - OutboxIngestorTest (Feature, Task 19): exercises the §7.2
        #     validate-then-insert flow against real PG tables — UNIQUE
        #     (tenant_id, terminal_id, sequence_number) sequence_conflict
        #     detection, in-table quarantine rows with valid hash-format
        #     CHECKs, and the §7.5 projection-row creation in the same
        #     transaction. SQLite passes locally (RefreshDatabase rebuilds
        #     a portable subset of the schema) but PG is the production
        #     truth — the CHECK constraints, FKs, and partial-unique
        #     indexes only exist there.
        #   - FiscalEventIngestionEndpointTest (Feature, Task 20): the
        #     HTTP boundary for the OutboxIngestor — sequence_conflict
        #     routing, malformed-envelope 422, cross-tenant 403. SQLite
        #     covers the routing-layer happy-path locally; PG is the
        #     production truth because the CHECK constraints on
        #     `fiscal_event_quarantine.integrity_exception_class`
        #     (Task 10 + the round-2 widening for `malformed_envelope`)
        #     only fire there.
        #   - PosCoreReceiptProjectionTest (Feature, Task 21): the
        #     POS-core projector writes into `pos_receipts` (PG-only
        #     CHECK constraints — `pos_receipts_totals`,
        #     `pos_receipts_hash_length`, `pos_receipts_discount_positive`),
        #     `pos_receipt_payments` (PG-only `pos_receipt_payments_amount`
        #     CHECK + tenant-scoped `payment_method_id` FK), and
        #     `pos_receipt_vat_details` (PG-only `pos_receipt_vat_details_gross_calc`
        #     CHECK). The atomic INSERT ... ON CONFLICT ON CONSTRAINT
        #     `pos_receipts_fiscal_event_id_unique` idempotency primitive
        #     also only resolves to the named constraint on PG. SQLite
        #     covers the happy-path locally; PG is the production truth
        #     for the projector's failure-mode contract.
        #   - AccountChargeProjectionTest (Feature, Phase 3 Task 6): the
        #     POS-core ACCOUNT_CHARGE printable projector writes a jsonb
        #     payload snapshot plus a unique `fiscal_event_id` idempotency
        #     guard. SQLite covers local happy-path replay; PG is the
        #     production truth for jsonb, UUID FKs, and unique replay
        #     semantics.
        #   - TreasuryAccountChargeBridgeTest (Feature, Phase 3 Task 8):
        #     the Treasury ACCOUNT_CHARGE bridge posts AR journal_entries /
        #     journal_lines from sealed fiscal events, relies on the PG
        #     advisory-lock primitive for same-event concurrency, and must
        #     fail closed on cross-company partner aliases before any AR row
        #     is persisted. SQLite covers local happy-path replay; PG is the
        #     production truth for advisory locks, UUID FKs, rollback
        #     semantics, and idempotency-tail behaviour.
        #   - DocumentAccountChargeFactureBridgeTest (Feature, Phase 3
        #     Task 9): the Sales-gated ACCOUNT_CHARGE document bridge writes
        #     draft invoice/document_lines from sealed fiscal events and
        #     must stay draft-only, idempotent by fiscal event reference,
        #     and tenant/company scoped on the business customer lookup.
        #     SQLite covers local happy-path replay; PG is the production
        #     truth for UUID FKs, jsonb payload snapshots, document-line
        #     uniqueness, and CI visibility of the Sales module projection.
        #   - TaskPhase3AccountChargeFullFlowTest (Feature, Phase 3 Task
        #     10): the ACCOUNT_CHARGE closure matrix posts sealed device
        #     envelopes through `/pos/sync/fiscal-events`, applies
        #     POS-core/Treasury/Sales projectors synchronously, and asserts
        #     exact canonical bytes, module-gated projection rows, AR journal
        #     entries, and draft facture documents. SQLite covers the local
        #     happy path; PG is the production truth for jsonb snapshots, UUID
        #     FKs, projection-row uniqueness, and bridge transaction rollback.
        #   - TreasuryReceiptBridgeTest (Feature, Task 22): the Treasury
        #     bridge writes `payments` rows with the PG-only
        #     `payments_fiscal_event_id_fk` FK + `payments_fiscal_event_id_idx`
        #     partial index (Task 12 migration) and exercises the cross-
        #     tenant `repository_id` fail-closed lookup. SQLite passes
        #     the happy path; PG is the production truth for the FK +
        #     index behaviour the bridge depends on for idempotency-tail
        #     hot scans.
        #   - PaymentOriginWriterInventoryTest (Feature, Task 22): pins
        #     `payments.origin` stamping across the complete §13 writer
        #     inventory (10 rows) — the PG-only `payments_fiscal_event_id_fk`
        #     + the partial-unique index on
        #     (company_id, original_payment_id, refund_request_id) for
        #     receipt-proration idempotency only fire on PG.
        #   - ParseFailureResumeTest (Feature, Task 24): the atomic
        #     `failed → parsed` resume contract is gated by the PG-only
        #     immutability trigger (Task 8 migration lines 154–230) —
        #     the trigger is what raises if the resolution UPDATE misses
        #     any of the four columns (payload / payload_parse_status /
        #     integrity_status / integrity_resolved_(at|by)) in one
        #     statement. SQLite has no trigger so the unit-level
        #     contract is only fully exercised on PG.
        #   - TerminalRegistrySnapshotTest (Feature, Task 26): the
        #     server-authored TERMINAL_REGISTRY_SNAPSHOT path persists
        #     real `fiscal_events` rows whose `current_hash` /
        #     `previous_hash` go through the PG-only 64-hex CHECK
        #     constraints (`fiscal_events_current_hash_format`,
        #     `fiscal_events_previous_hash_format`) and whose
        #     `event_type` goes through the enum-sourced
        #     `fiscal_events_event_type_allowed` whitelist. SQLite passes
        #     the happy path; PG is the production truth that the
        #     emitter's canonical-bytes envelope yields a row PG will
        #     accept without rejecting it as a malformed hash or
        #     unwhitelisted type.
        #   - VerifyEventChainCommandTest (Feature, Task 31): the
        #     `fiscal:verify-event-chain` command seeds both `fiscal_events`
        #     and `fiscal_event_quarantine` fixtures whose `current_hash` /
        #     `previous_hash` columns go through the PG-only 64-hex CHECK
        #     constraints, and whose `integrity_exception_class` goes
        #     through the PG-only quarantine-class whitelist (Task 10 +
        #     Task 19 round-2 widening for `malformed_envelope`). SQLite
        #     passes the happy path; PG is the production truth that the
        #     seeded fixtures (valid chain, tampered fixture,
        #     `sequence_conflict` quarantine row) yield rows PG will
        #     accept — ensuring the command's CI fixtures stay aligned
        #     with the production schema.
        #   - NewSaleServerAuthoringDispositionTest (Feature, Task 29):
        #     pins spec §14.2 — all three new-sale authoring routes
        #     (POST /pos/receipts, POST /pos/receipts/{id}/payments,
        #     POST /pos/orders/{id}/close) return HTTP 410 Gone with
        #     `NEW_SALE_AUTHORING_RETIRED`. Also pins the knowingly-retained
        #     carve-outs (void / processReturn) + the read-only routes +
        #     the `/pos/receipts/sync` Task-28-handoff invariant. The
        #     Receipt::factory + Order seed paths go through the PG-only
        #     `pos_receipts` / `pos_orders` schemas (UUID CHECK constraints,
        #     enum columns); SQLite passes the happy path but PG is the
        #     production truth that the seed factories accept the inserted
        #     rows without a constraint violation.
        #   - DeviceLossIncidentTest (Feature, Task 32 + round-2): the §12
        #     device-loss incident register table goes through PG-only DDL —
        #     the `device_loss_incidents_recovery_status_allowed` CHECK
        #     (DeviceLossIncidentStatus whitelist), FKs to tenants /
        #     companies / users, the `device_loss_incidents_tenant_terminal_idx`
        #     admin-browse index, and the `device_loss_incidents_open_status_idx`
        #     partial index scanning OPEN incidents (reported / recovering)
        #     only. Round-2 T32-P1 swaps the simple `terminal_id` FK for the
        #     composite `device_loss_incidents_terminal_scope_fk` covering
        #     `(terminal_id, tenant_id, company_id) → pos_terminals(id, tenant_id,
        #     company_id)` (with the redundant UNIQUE
        #     `pos_terminals_id_tenant_company_unique` to satisfy PG's
        #     composite-FK referent requirement). The new PG-only test
        #     `test_cross_tenant_terminal_id_is_rejected_by_composite_fk_on_postgres`
        #     pins the cross-tenant rejection by SQLSTATE 23503 + constraint
        #     name; the round-2 round-2 raw-insert tests also seed real
        #     tenant/company/terminal/user refs so the CHECK assertions actually
        #     reach the CHECK rather than tripping FK orphans (T32-B1). SQLite
        #     covers the column-presence + Eloquent-cast + boundary discipline
        #     (recovery_status not in $fillable) layer; PG is the production
        #     truth for the CHECK + composite FK + named-index contracts.
        #   - VirtualAdminTerminalResolverTest (Feature, Phase 4): the
        #     one-virtual-admin-terminal-per-company invariant is enforced by
        #     the PG unique index. SQLite covers resolver behavior; PG is the
        #     production truth for duplicate rejection.
        #   - PaymentAllocationPrecisionTest + PartnerMoneyPrecisionTest
        #     (Feature, remediation R-9): PG-only information_schema and
        #     pg_constraint checks that pin DECIMAL(15,3) money columns and
        #     partner cached-liability non-negative constraints.
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: autoerp_test
          DB_USERNAME: autoerp
          DB_PASSWORD: secret
        run: |
          php artisan test \
            --filter="VoucherLedgerTest|VoucherLedgerAppendOnlyTest|VoucherSchemaTest|FiscalHardeningE2ETest|FiscalEventsTableTest|FiscalEventsImmutabilityTest|FiscalEventProjectionsTableTest|FiscalEventQuarantineTableTest|PosReceiptsCanonicalBytesTest|PaymentsOriginColumnsTest|OutboxIngestorTest|FiscalEventIngestionEndpointTest|PosCoreReceiptProjectionTest|AccountChargeProjectionTest|TreasuryAccountChargeBridgeTest|DocumentAccountChargeFactureBridgeTest|TaskPhase3AccountChargeFullFlowTest|TreasuryReceiptBridgeTest|PaymentOriginWriterInventoryTest|ParseFailureResumeTest|TerminalRegistrySnapshotTest|VerifyEventChainCommandTest|NewSaleServerAuthoringDispositionTest|ChokepointCompletenessTest|ReceiptChainRebuildTest|DeviceLossIncidentTest|VirtualAdminTerminalResolverTest|PaymentAllocationPrecisionTest|PartnerMoneyPrecisionTest|WacSerializationConcurrencyTest|ZReportImmutabilityTest|ZReportProjectionTest|GenerateZReportWithCountsTest|ProcurementPolicyCheckConstraintTest"

  t6-phase0b-pgsql:
    name: T6 Phase 0b — database-per-tenant flip (PHPUnit + PostgreSQL)
    runs-on: ubuntu-latest
    # T6 Phase 0b GATE: the row-level -> database-per-tenant flip must be proven
    # on real PostgreSQL (per-tenant database creation, central Sanctum PAT,
    # cross-DB FK audit, fail-closed resolver) before merge to dev OR main —
    # SQLite cannot host any of these. Kept SEPARATE from the broader
    # backend-test-pgsql fiscal-invariant filter so this gate reflects ONLY the
    # Phase 0b surface and stays green independent of pre-existing fiscal debt.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.base_ref == 'dev' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: autoerp
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: autoerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoerp -d autoerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_ENV: testing
      BROADCAST_CONNECTION: 'null'
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env.testing

      - name: Configure test environment (PostgreSQL)
        run: |
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=autoerp_test/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=autoerp/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env.testing
          # The single-connection test suite points `central` at the default DB.
          sed -i 's/DB_CENTRAL_DATABASE=.*/DB_CENTRAL_DATABASE=autoerp_test/' .env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env.testing
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env.testing
          sed -i 's/BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env.testing

      - name: Run T6 Phase 0b PostgreSQL tests
        # phpunit-pgsql.xml forces DB_CONNECTION=pgsql. The flip test creates real
        # per-tenant databases (the POSTGRES_USER is the container superuser and
        # may CREATE/DROP DATABASE).
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: autoerp_test
          DB_CENTRAL_DATABASE: autoerp_test
          DB_USERNAME: autoerp
          DB_PASSWORD: secret
        run: |
          php artisan test -c phpunit-pgsql.xml \
            --filter="TenantStanclFlipTest|TenantDatabaseIsolationTest|TenantProvisioningServiceTest|TenantReferenceDataSeedingTest|CentralPersonalAccessTokenPhase0bTest|CentralConnectionTest|TenancyManagerConfigTest|TenantMigrationsLoadedInTestingTest|CrossDbForeignKeyAuditTest|PlanLimitsServiceTest|TenancyResolverFailClosedTest|PendingSealMigrationTest|DeviceLossIncidentTest|FiscalEventQuarantineTableTest|FiscalEventsImmutabilityTest|ReceiptChainRebuildTest"

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run TanStack query key audit
        run: pnpm audit:keys

      - name: Run design-system audit
        run: pnpm audit:design-system

      - name: Run ESLint warning ratchet
        # Supersedes a raw `pnpm lint`: errors still hard-fail immediately,
        # and the per-app warning count is ratcheted against
        # scripts/lint-warning-baseline.json (may shrink/hold, never grow).
        # Runs from the repo root and covers both @autoerp/web and
        # @autoerp/pos. See docs/qa/lint-warning-ratchet-2026-05-14.md.
        run: pnpm lint:ratchet
        working-directory: .

  frontend-typecheck:
    name: Frontend Type Check (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run TypeScript check
        run: pnpm typecheck

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run tests
        run: pnpm test

  pos-test:
    name: POS Tests (Vitest)
    runs-on: ubuntu-latest
    # Gate 1 (TS fixture-integrity) and Gate 2 (cross-language fixture sync)
    # live in apps/pos. This job is the merge gate that runs them.
    # Runs on EVERY pull request (not just PR→main): POS regressions reached
    # dev unverified (e.g. PR #177's CustomerAttachPanel break) because this was
    # previously main-only. POS Vitest is cheap (~2 min) and also catches POS
    # breakage caused by shared-package changes outside apps/pos.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run tests
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    # Heavy job: only on PR→main, push→main, or manual workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [frontend-lint, frontend-typecheck, frontend-test]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  types-drift:
    name: Generated Types Drift Guard
    runs-on: ubuntu-latest
    # Intentionally lean: no .env, no APP_KEY, no Postgres, no Redis.
    # `php artisan typescript:transform` is pure reflection — it loads the
    # service-provider graph but never opens a DB/Redis connection. If this
    # job ever fails with a connection error, audit recent service-provider
    # changes for lazy-boot paths that hit infrastructure.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Regenerate TypeScript types
        run: php artisan typescript:transform

      - name: Fail if generated.d.ts is out of sync
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --quiet -- packages/shared/types/generated.d.ts; then
            echo "::error::packages/shared/types/generated.d.ts is out of date. A #[TypeScript]-tagged PHP DTO changed without a matching regen."
            echo ""
            echo "To fix:"
            echo "  (cd apps/api && php artisan typescript:transform)"
            echo "  git add packages/shared/types/generated.d.ts"
            echo "  git commit -m 'chore(types): regenerate TypeScript types'"
            echo ""
            echo "Diff summary:"
            git --no-pager diff --stat -- packages/shared/types/generated.d.ts
            echo ""
            echo "First 200 lines of the diff:"
            git --no-pager diff -- packages/shared/types/generated.d.ts | head -200
            exit 1
          fi

  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    # Only meaningful when the heavy jobs ran. Skipped on PR→dev.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [backend-lint, backend-analyse, backend-architecture, backend-test, backend-test-pgsql, frontend-lint, frontend-typecheck, frontend-test, pos-test, frontend-build, types-drift]
    steps:
      - name: All checks passed
        run: echo "All CI checks have passed!"
